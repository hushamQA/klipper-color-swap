# COLOR_SWAP version 6 - buttons for KlipperScreen on ANY printer.
# Paste these sections into your own KlipperScreen.conf, ABOVE the line
#   "#~# --- Do not edit below this line. This section is auto generated --- #~#"
# then restart KlipperScreen. The icons (settings, filament, resume) are part of
# every KlipperScreen theme, so nothing else has to be copied.

# Main menu > Color swap settings: every setting, changed with buttons.
[menu __main color_swap_settings]
name: {{ gettext('Color swap settings') }}
icon: settings
method: printer.gcode.script
params: {"script":"COLOR_SWAP_SETTINGS"}

# The same window while printing: Print screen > Menu > Color swap settings.
[menu __print color_swap_settings]
name: {{ gettext('Color swap settings') }}
icon: settings
method: printer.gcode.script
params: {"script":"COLOR_SWAP_SETTINGS"}

# Reopens the color swap window if it was closed. Print screen > Menu > Color swap.
[menu __print color_swap]
name: {{ gettext('Color swap') }}
icon: filament
method: printer.gcode.script
params: {"script":"COLOR_SWAP_PROMPT"}

# Continues a stopped print (cancel at a swap, head moved, power cut) from its
# last saved point. Main menu > Resume saved.
[menu __main resume_saved]
name: {{ gettext('Resume saved') }}
icon: resume
method: printer.gcode.script
params: {"script":"RESUME_SAVED_PRINT"}
