# A plain Mainsail-style printer with NO color swap hook lines at all (test only).
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  M83
  G1 E-1 F2100
  G91
  G1 Z5 F900
  G90
  G1 X200 Y200 F6000

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  M83
  G1 E1 F2100
  RESUME_BASE {% if 'VELOCITY' in params %}VELOCITY={params.VELOCITY}{% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  M104 S0
  CANCEL_PRINT_BASE
