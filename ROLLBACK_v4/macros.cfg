[gcode_macro START_PRINT]
description: Start G-Code
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
  {% set SOAK = params.SOAK|default(0)|int %}
  {% set MESH = params.MESH|default(0)|int %}
  # A new print: forget the resume point of the previous one (color_swap.cfg).
  {% if "gcode_macro _CS_CLEAR_CHECKPOINT" in printer %}
  _CS_CLEAR_CHECKPOINT
  {% endif %}
  LED_HOTEND_ON
  G21
  G90
  M83
  RESPOND MSG="Heating bed and nozzle in parallel..."
  M140 S{BED_TEMP}
  M104 S{EXTRUDER_TEMP}
  G28
  M190 S{BED_TEMP}
  {% if SOAK > 0 %}
  RESPOND MSG="Heat soak {SOAK}s - stabilising frame geometry..."
  G4 P{SOAK * 1000}
  {% endif %}
  {% if MESH == 1 %}
  BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
  {% else %}
  BED_MESH_PROFILE LOAD=default
  {% endif %}
  M109 S{EXTRUDER_TEMP}
  G1 X0 Y0 Z10 F3000
  # Prime 5mm inside the physical R150 bed and 2mm inside the R147 mesh.
  G1 X-145 Y0 Z0.6 F3000
  G92 E0
  G3 X0 Y-145 I145 J0 Z0.4 E30 F2000
  G92 E0
  G1 E-1 F2100


[gcode_macro END_PRINT]
description: End G-Code
gcode:
  M106 S0
  M104 S0
  M140 S0
  G92 E0
  G1 E-1 F2100
  NEOPIXEL_GREEN
  _SAFE_PARK
  LED_HOTEND_OFF
  # Finished: nothing left to resume (color_swap.cfg).
  {% if "gcode_macro _CS_CLEAR_CHECKPOINT" in printer %}
  _CS_CLEAR_CHECKPOINT
  {% endif %}


[gcode_macro _SAFE_PARK]
description: Safely lift, center, and park near the top without re-homing
gcode:
  {% if printer.toolhead.homed_axes == "xyz" %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = [0.0, [10.0, max_z - act_z]|min]|max %}
  {% set park_z = max_z - 10.0 %}
  G91
  G1 Z{z_safe} F3000
  G90
  G1 X0 Y0 F6000
  G1 Z{park_z} F6000
  {% endif %}


[gcode_macro LED_HOTEND_ON]
description: Turn on Hotend LEDs
gcode:
  SET_PIN PIN=LED_Hotend VALUE=1


[gcode_macro LED_HOTEND_OFF]
description: Turn off Hotend LEDs
gcode:
  SET_PIN PIN=LED_Hotend VALUE=0


[gcode_macro LED_LOGO_ON]
description: Turn on Logo LEDs
gcode:
  SET_PIN PIN=LED_Logo VALUE=1


[gcode_macro LED_LOGO_OFF]
description: Turn off Logo LEDs
gcode:
  SET_PIN PIN=LED_Logo VALUE=0


[gcode_macro _PARK_FOR_PAUSE]
description: Helper - one safe lift and park that respects the delta cone. Not for direct use.
gcode:
  {% set max_z  = printer.toolhead.axis_maximum.z|float %}
  {% set cone_z = printer.toolhead.cone_start_z|float %}
  {% set act_z  = printer.toolhead.position.z|float %}
  {% set park_x = params.X|default(0)|float %}
  {% set park_y = params.Y|default(-140)|float %}
  {% set min_h  = params.MIN_Z|default(50)|float %}
  {% set lift   = params.LIFT|default(10)|float %}
  # Lift to at least MIN_Z, never downwards, never above the park ceiling used by _SAFE_PARK.
  {% set want   = [act_z + lift, min_h]|max %}
  {% set park_z = [[want, max_z - 10.0]|min, act_z]|max %}
  {% if park_z <= cone_z %}
  # Below the delta cone the full print radius is allowed, so lifting over the
  # model first and then moving aside is safe.
  G90
  G1 Z{park_z} F3000
  G1 X{park_x} Y{park_y} F6000
  {% else %}
  # Above the cone only X0 Y0 is guaranteed reachable, so centre first, then lift.
  RESPOND MSG="Park height {park_z|round(1)} is above the delta cone - parking at centre"
  G90
  G1 X0 Y0 F6000
  G1 Z{park_z} F3000
  {% endif %}
  M400


[gcode_macro PAUSE]
description: Pause the current print - one lift and park, no filament handling
rename_existing: PAUSE_BASE
gcode:
  {% set x     = params.X|default(0)|float %}
  {% set y     = params.Y|default(-140)|float %}
  {% set lift  = params.Z|default(10)|float %}
  {% set min_z = params.MIN_Z|default(50)|float %}
  {% set e     = params.E|default(1)|float %}
  {% if printer.pause_resume.is_paused %}
  RESPOND MSG="Print is already paused."
  {% else %}
  RESPOND MSG="Pausing..."
  PAUSE_BASE
  {% if printer.extruder.can_extrude %}
  M83
  G1 E-{e} F2100
  {% endif %}
  _PARK_FOR_PAUSE X={x} Y={y} LIFT={lift} MIN_Z={min_z}
  {% endif %}


[gcode_macro M600]
description: Filament change / runout - parks once, unloads, then waits for RESUME
variable_hotend_temp: 0
variable_m600_enabled: 0
gcode:
  {% set x      = params.X|default(0)|float %}
  {% set y      = params.Y|default(-140)|float %}
  {% set lift   = params.Z|default(10)|float %}
  {% set min_z  = params.MIN_Z|default(50)|float %}
  {% set e      = params.E|default(1)|float %}
  # UNLOAD is the TOTAL retract distance, split into a slow break and a fast pull,
  # and paired with the 80 mm that LOAD_FILAMENT pushes back in.
  {% set unload = params.UNLOAD|default(40)|float %}
  {% set unload_fast = [unload - 10.0, 0.0]|max %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=hotend_temp VALUE={printer.extruder.target}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_enabled VALUE=1
  SET_IDLE_TIMEOUT TIMEOUT=86400
  # On a sensor runout Klipper already executed PAUSE (which parked). Do not park twice.
  {% if not printer.pause_resume.is_paused %}
  PAUSE X={x} Y={y} Z={lift} MIN_Z={min_z} E={e}
  {% endif %}
  {% if printer.extruder.can_extrude %}
  RESPOND MSG="Unloading filament..."
  M83
  G1 E-10 F300
  G1 E-{unload_fast} F800
  M400
  {% else %}
  RESPOND TYPE=error MSG="Nozzle too cold to unload. Heat it, then run UNLOAD_FILAMENT."
  {% endif %}
  RESPOND MSG="Load filament with LOAD_FILAMENT, wipe the nozzle, then press RESUME. Heater stays on."


[gcode_macro RESUME]
description: Resume the current print - returns to the saved position, no automatic purge
rename_existing: RESUME_BASE
gcode:
  ##### set defaults #####
  {% set e = params.E|default(1)|float %}
  {% set saved_temp = printer["gcode_macro M600"].hotend_temp|float %}
  # Read before _COLOR_SWAP_ON_RESUME clears it: a finished color swap has already
  # primed the nozzle, so skip the 1 mm push here and travel back fast.
  {% set swap = "gcode_macro COLOR_SWAP" in printer and printer["gcode_macro COLOR_SWAP"].state|int == 2 %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
  {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {% elif swap %}
  {% set get_params = ('VELOCITY=' ~ printer["gcode_macro _COLOR_SWAP_CFG"].resume_speed) %}
  {%else %}
  {% set get_params = "" %}
  {% endif %}
  {% if swap %}
  {% set e = 0 %}
  {% endif %}
  ##### end of definitions #####
  {% if not printer.pause_resume.is_paused %}
  RESPOND TYPE=error MSG="Print is not paused."
  {% else %}
  _COLOR_SWAP_ON_RESUME
  SET_IDLE_TIMEOUT TIMEOUT=1800
  {% if printer["gcode_macro M600"].m600_enabled|int == 1 %}
  {% if saved_temp > 0 %}
  RESPOND MSG="Restoring nozzle temperature..."
  M109 S{saved_temp}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_enabled VALUE=0
  {% endif %}
  {% if printer.extruder.can_extrude and e > 0 %}
  M83
  G1 E{e} F2100
  {% endif %}
  RESPOND MSG="Resuming..."
  RESUME_BASE {get_params}
  {% endif %}


[gcode_macro CANCEL_PRINT]
description: Cancel the current print
rename_existing: CANCEL_PRINT_BASE
gcode:
  RESPOND MSG="Printing canceled!"
  M106 S0
  M104 S0
  M140 S0
  _COLOR_SWAP_RESET
  _SAFE_PARK
  CANCEL_PRINT_BASE


[gcode_macro UNLOAD_FILAMENT]
description: Filament unloading - always heats and WAITS first (TEMP=, default 240 = safe for PLA and PETG)
gcode:
  # Never pull filament while the nozzle is cooling: it jams. The old version skipped
  # heating whenever the nozzle read >= 200C, even with the heater already off.
  {% set temp = params.TEMP|default([printer.extruder.target|float, 240.0]|max)|float %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  SAVE_GCODE_STATE NAME=unload_state
  RESPOND MSG="Heating to {temp|int}C before unloading..."
  M109 S{temp}
  RESPOND MSG="Unloading filament..."
  G91
  G0 E-10 F300
  G0 E-30 F800
  RESTORE_GCODE_STATE NAME=unload_state
  {% endif %}


[gcode_macro LOAD_FILAMENT]
description: Filament loading - always heats and WAITS first (TEMP=, default 230)
gcode:
  {% set temp = params.TEMP|default([printer.extruder.target|float, 230.0]|max)|float %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  SAVE_GCODE_STATE NAME=load_state
  RESPOND MSG="Heating to {temp|int}C before loading..."
  M109 S{temp}
  RESPOND MSG="Loading filament..."
  G91
  G0 E50 F800
  G0 E30 F300
  M400
  RESTORE_GCODE_STATE NAME=load_state
  {% endif %}



[gcode_macro Z_OFFSET_CALIBRATION]
description: Start Z Offset Probe Calibration
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  SET_GCODE_OFFSET Z=0
  PROBE_CALIBRATE
  {% endif %}


[gcode_macro SECURITY_OFFSET]
description: Apply 1mm Safety Offset
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  SET_GCODE_OFFSET Z_ADJUST=1.0 MOVE=1
  RESPOND TYPE=info MSG="1mm safety offset applied. Adjust with Fine Tuning during first layer."
  {% endif %}


[gcode_macro ENDSTOPS_CALIBRATION]
description: Start Endstops Phase Calibration
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  G91
  G1 Z-50 F1500
  G90
  G28
  G91
  G1 Z-50 F1500
  G90
  G28
  G91
  G1 Z-50 F1500
  G90
  G28
  G91
  G1 Z-50 F1500
  G90
  G28
  G91
  G1 Z-50 F1500
  G90
  G28
  ENDSTOP_PHASE_CALIBRATE stepper=stepper_a
  ENDSTOP_PHASE_CALIBRATE stepper=stepper_b
  ENDSTOP_PHASE_CALIBRATE stepper=stepper_c
  {% endif %}


[gcode_macro DELTA_CALIBRATION]
description: Start Delta Calibration
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  SET_GCODE_OFFSET Z=0
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  DELTA_CALIBRATE
  G1 X0 Y0 Z50 F2500
  G28
  SAVE_CONFIG
  {% endif %}


[gcode_macro BED_LEVELING]
description: Start Bed Leveling
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  G1 X0 Y0 Z50 F2500
  BED_MESH_CALIBRATE
  G1 X0 Y0 Z50 F2500
  G28
  SAVE_CONFIG
  {% endif %}


[gcode_macro PID_BED_65]
description: Start Bed PID
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  M106
  G1 Z50 F1500
  RESPOND MSG="Bed PID in progress..."
  PID_CALIBRATE HEATER=heater_bed TARGET={params.TEMP|default(65)}
  G28
  SAVE_CONFIG
  {% endif %}


[gcode_macro PID_HOTEND_220]
description: Start Hotend PID
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  M106
  G1 Z50 F1500
  RESPOND MSG="Hotend PID in progress..."
  PID_CALIBRATE HEATER=extruder TARGET={params.TEMP|default(220)}
  G28
  SAVE_CONFIG
  {% endif %}


[gcode_macro ADXL_TEST]
description: ADXL Test
gcode:
  ACCELEROMETER_QUERY


[gcode_macro ADXL_NOISE]
description: Measure Accelerometer Noise
gcode:
  MEASURE_AXES_NOISE


[gcode_macro ADXL_AXE_X]
description: Measure X axis resonances
gcode:
  SHAPER_CALIBRATE AXIS=X


[gcode_macro ADXL_AXE_Y]
description: Measure Y axis resonances
gcode:
  SHAPER_CALIBRATE AXIS=Y


[gcode_macro MOVE_TO_Z0]
description: Move to Z=0
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  LED_HOTEND_ON
  G1 Z0 F2500
  {% endif %}


[gcode_macro ZUP]
description: Raise Nozzle
gcode:
  SET_GCODE_OFFSET Z_ADJUST=0.025 MOVE=1


[gcode_macro ZDOWN]
description: Lower Nozzle
gcode:
  SET_GCODE_OFFSET Z_ADJUST=-0.025 MOVE=1


[gcode_macro PRESSURE_ADVANCE]
description: Pressure Advance
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  SET_PRESSURE_ADVANCE ADVANCE=0   
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
  TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005
  {% endif %}


[gcode_macro M204]
description: Set default Acceleration
rename_existing: M204.1
gcode:
  {% set f = params.F|default(0.5)|float %}
  {% if 'S' in params %}
  {% set s = params.S|float %}
  SET_VELOCITY_LIMIT ACCEL={s} 
  {% else %}
  {% if 'P' in params %}
  {% set p = params.P|float %}
  {% if 'T' in params %}
  {% set t = params.T|float %}
  {% if p < t %}
  SET_VELOCITY_LIMIT ACCEL={p} 
  {% else %}
  SET_VELOCITY_LIMIT ACCEL={t} 
  {% endif %}
  {% else %}
  SET_VELOCITY_LIMIT ACCEL={p} 
  {% endif %}
  {% elif 'T' in params %}
  {% set t = params.T|float %}
  SET_VELOCITY_LIMIT ACCEL={t} 
  {% endif %}
  {% endif %}


[gcode_macro M205]
description: Alternative to Jerk
gcode:
  {% if 'X' in params %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X|int}
  {% elif 'Y' in params %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y|int}
  {% endif %}


[gcode_macro SET_GCODE_OFFSET]
description: Set G-Code Offset (X/Y only persisted)
rename_existing: _SET_GCODE_OFFSET
gcode:
  _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}


[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 2
gcode:
  { action_respond_info("Z gcode offset persistence DISABLED for safety. Use PROBE_CALIBRATE instead.") }
[gcode_macro _TMC]
gcode:
  DUMP_TMC STEPPER=stepper_a
  DUMP_TMC STEPPER=stepper_b
  DUMP_TMC STEPPER=stepper_c
  DUMP_TMC STEPPER=extruder
