#   ___      _              ___
#  / __|___ | |___ _ _     / __|_ __ ____ _ _ __
# | (__/ _ \| / _ \ '_|    \__ \ V  V / _` | '_ \
#  \___\___/|_\___/_|      |___/\_/\_/\__,_| .__/
#                                          |_|
# Manual multi-color on a single nozzle - Flsun V400 - version 5 (2026-11-06)
#
# One G-code file from OrcaSlicer; every filament change calls COLOR_SWAP.
# The print pauses in place: nozzle and bed stay hot, no re-homing, no re-mesh,
# so every color lands exactly where the slicer put it.
#
#   OrcaSlicer > Printer > Multimaterial > Manual filament change: ON
#   Change filament G-code (one line):
#     {if layer_num >= 0}COLOR_SWAP SLOT={next_extruder + 1} MATERIAL={filament_type[next_extruder]} OLD_MATERIAL={filament_type[previous_extruder]} TEMP={new_filament_temp} OLD_TEMP={old_filament_temp} RETRACT={new_retract_length_toolchange} PURGE={flush_length}{endif}
#
# SAFETY RULE: the nozzle never goes lower than where the slicer paused it.
#   PAUSE lifts straight up, then moves to the front edge. Load, purge and the
#   flick are extruder or sideways-only moves at that height. RESUME returns in
#   one straight line to the paused point, which is the layer height plus the
#   slicer's Z-hop, so every point of that line is above the printed model.
#   Version 2 drew a wipe line on the bed at Z 0.3 - removed for that reason.
#
# Filament accounting (no gap and no blob when the print continues):
#   swap start   slicer retracted RETRACT, PAUSE retracts 1, unload pulls it out
#   load+purge   ends retracted by `hold` = max(RETRACT, 1)
#   continue     pushes hold + reprime_mm, retracts exactly RETRACT, flicks,
#                then travels fast; the slicer pushes RETRACT back on the model
#
# Needs in macros.cfg:  RESUME calls _COLOR_SWAP_ON_RESUME (and skips its own
#                       1 mm push during a swap), CANCEL_PRINT calls _COLOR_SWAP_RESET,
#                       START_PRINT and END_PRINT call _CS_CLEAR_CHECKPOINT.
#
# Head lock (version 4): while a swap waits, the tower motors hold at their run
#   current instead of hold_current, so pushing filament in does not move the head.
#   If it moved anyway, the "Re-home" button homes (straight UP on a delta) and
#   returns to the park point; Continue then lands exactly where it paused.
#
# Resume after a stop (version 4): a resume point is saved at every layer start
#   (OrcaSlicer > Printer > Machine G-code > Before layer change G-code, add):
#     _CS_CHECKPOINT LAYER={layer_num + 1} TOTAL={total_layer_count} SLOT={current_extruder + 1} MATERIAL={filament_type[current_extruder]}
#   and at every color swap. RESUME_SAVED_PRINT (KlipperScreen: Resume saved)
#   heats, homes, parks, lets you load and purge, then continues the same file
#   from that byte. Delta printers only: their homing moves up, away from the part.
#
# Version 5 (2026-11-06):
#   - power-loss save every minute from Klipper itself (any slicer profile), and the
#     resume window opens by itself after the printer starts
#   - no flick after a swap (flick: 0)
#   - safe buttons: no buttons while the printer works, "Continue..." asks once more,
#     and the slot where "Load + purge" was only purges
#   - going back to the main filament purges purge_to_main_extra (60 mm) more, in pulses
#   - layer 1 only: a short wipe arc on the bed edge after each swap
#   - END_PRINT calls _CS_CLEAR_CHECKPOINT DONE=1


[gcode_macro _COLOR_SWAP_CFG]
description: Settings for COLOR_SWAP - edit the variables, not the macros
# Purge in the air above the front edge of the bed. Never lower than the model + park_lift.
variable_park_x: 0
variable_park_y: -140
variable_park_lift: 10
variable_park_min_z: 60
# Unload (Marlin-style tip forming): push unload_purge_mm, snap back 13 mm fast,
# let the tip set in the cold zone, then pull the rest. Always done hot.
variable_unload_mm: 40
variable_unload_purge_mm: 3
variable_unload_dwell_ms: 3000
# Load: the first part fast, the last load_slow_mm slowly into the melt zone so the
# extruder never grinds while it pushes the old plastic out.
variable_load_mm: 40
variable_load_slow_mm: 15
variable_load_speed: 600
# Purge length in mm of filament (1 mm = 2.4 mm3). OrcaSlicer sends PURGE from its
# flushing-volume matrix (the same standard Bambu and Prusa use for color changes).
# purge_min and purge_max clamp it; purge_default is used when no PURGE is sent
# (50 mm = Marlin ADVANCED_PAUSE_PURGE_LENGTH, about 120 mm3 like Prusa's 140 mm3).
variable_purge_min: 25
variable_purge_max: 250
variable_purge_default: 50
# Added when the material type changes (PLA <-> PETG): the old plastic must be cleared.
variable_purge_material_change: 15
# >>> EDIT HERE to change the purge when going BACK to the print's main filament
# after the support filament (e.g. PLA support -> PETG body). Added on top of the
# purge above. A trace of PLA left in PETG looks clean but makes that layer brittle,
# so this one is purged by volume, not by eye. Default 60 mm (about 145 mm3).
# The main filament = the one the print started with (before its first swap).
variable_purge_to_main_extra: 60
# 3 mm/s = Marlin ADVANCED_PAUSE_PURGE_FEEDRATE.
variable_purge_speed: 180
# Pulsed purge: the purge is pushed in chunks of purge_pulse_mm, with a quick
# pull-back and push of purge_pulse_retract mm between chunks. The pressure swings
# flush old plastic out of the corners of the melt zone that a steady flow passes by.
# 0 = one steady purge as in version 4.
variable_purge_pulse_mm: 20
variable_purge_pulse_retract: 2
# One "Purge +N mm" button per entry, for extra cleaning only when the color is not clean.
variable_purge_buttons: [15, 30, 60]
# Changing to a cooler filament (PETG 250 -> PLA 220): purge at the hotter of the two
# temperatures so the old plastic melts out, cool down, then push settle_mm at the
# new temperature so the flow is steady before printing.
variable_settle_mm: 8
# On Continue: refill what ooze and the tweezers took out of the nozzle.
variable_reprime_mm: 1.5
# Flick after the reprime: part fan on, then short fast side moves snap the strand.
# 0 = off (version 5 default: you cut the strand yourself, the shake is not needed).
variable_flick: 0
variable_flick_mm: 8
variable_flick_cool_ms: 1500
# Speed of the return travel to the model in mm/s (Klipper's default is 50).
# Fast = less ooze on the way, so the first line of the new color is full.
variable_resume_speed: 250
# Temperature waits end as soon as the nozzle is within this many degrees of the
# target (Klipper's M109 also waits for the reading to settle, which is slow).
variable_heat_band: 3
# Material presets offered as buttons while the print waits.
variable_temp_pla: 215
variable_temp_petg: 240
# Heaters and motors stay on this long while waiting. Past it Klipper turns the
# motors off and the delta loses its position, so the print cannot continue.
variable_wait_timeout: 3600
# Name of the runout sensor section, switched off during a swap. A printer
# without one needs no change: a missing sensor is skipped.
variable_sensor: "filament_sensor"
# Head lock: 1 = while a swap or a resume waits, these motors hold at their
# run_current instead of hold_current (V400: 1.5 A instead of 0.5 A, three times
# the holding force). Restored when the print continues or is cancelled.
variable_hold_boost: 1
variable_hold_steppers: ["stepper_a", "stepper_b", "stepper_c"]
# Resume from a layer start: stop this far above the saved layer before the file
# continues (the file then sets the real height itself).
variable_resume_lift: 0.5
# Power-loss save: every autosave_s seconds while printing, the exact file position
# and machine state are saved (one small write). Works for every print and slicer
# profile; the Orca layer line is no longer required. 0 = off.
variable_autosave_s: 60
# After the printer starts with an unfinished print saved, show the resume window
# on its own (about a minute after boot, so KlipperScreen is up). 0 = off.
variable_boot_prompt: 1
# Wipe line, FIRST LAYER ONLY: when a swap happens in layer 1 (small letters in a
# second color...), a short arc is drawn on the bed edge after the purge so the new
# color starts full. Arc on the front-right quarter (the start prime line uses the
# front-left one); every first-layer swap moves the next arc wipe_step mm inward.
# Skipped, with the reason on screen, when a model outline comes within wipe_margin
# mm of the arc, or when the G-code has no object outlines. In layer 1 the arc
# (Z wipe_z) is not lower than the layer itself. 0 = off.
variable_first_layer_wipe: 1
# Layer 1 is known from the Orca _CS_CHECKPOINT line; without it, a swap counts as
# layer 1 when the nozzle stopped at or below this Z (first layer + Z-hop).
variable_first_layer_max_z: 0.75
variable_wipe_center_x: 0
variable_wipe_center_y: 0
variable_wipe_radius: 145
variable_wipe_step: 1.2
variable_wipe_z: 0.3
variable_wipe_e_per_mm: 0.1
variable_wipe_speed: 1200
variable_wipe_margin: 10
# Alerts at each stage (swap waiting, purge done, resume ready, saved print found,
# runout). notify_name = the [notifier ...] name in moonraker.conf ("" = no phone
# message). The beep needs a buzzer wired to the board and an [output_pin beeper]
# section in printer.cfg; without it the beep is skipped.
variable_notify_name: "phone"
variable_beeper_pin: "beeper"
variable_beep_count: 3
variable_beep_ms: 150
gcode:
  RESPOND MSG="_COLOR_SWAP_CFG holds settings only."


[gcode_macro COLOR_SWAP]
description: Pause in place for a manual color change: park, unload, then load + purge from the prompt
# state: 0 idle, 1 waiting for the new filament, 2 loaded - check the purge
variable_state: 0
variable_view: ""
variable_temp: 0
variable_old_temp: 0
variable_bed: 0
variable_fan: 0
variable_purge: 0
variable_slot: 0
variable_material: ""
variable_old_material: ""
variable_retract: 0
variable_hold: 1
variable_z_floor: 0
# Where the slicer stopped, in G-code coordinates (saved for RESUME_SAVED_PRINT).
variable_sx: 0
variable_sy: 0
variable_sz: 0
variable_se: 0
variable_sabse: 0
# Filament in the nozzle after the last finished swap (layer resume points use it
# when the slicer line does not send SLOT).
variable_cur_slot: 0
variable_cur_material: ""
# The print's main filament: the one it started with (OLD_MATERIAL of its first swap).
# Cleared at START_PRINT / END_PRINT. Going back to it adds purge_to_main_extra.
variable_main_material: ""
# 1 when this swap is in layer 1 (wipe line); first-layer arcs drawn in this print.
variable_first: 0
variable_wipe_count: 0
# 1 after END_PRINT, so the power-loss autosave does not save a finished print.
variable_done: 0
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set material = params.MATERIAL|default("")|upper %}
  {% set old_material = params.OLD_MATERIAL|default("")|upper %}
  {% set main = main_material if main_material else old_material %}
  {% set cur_layer = printer.print_stats.info.current_layer|default(0, true)|int %}
  {% if cur_layer > 0 %}
    {% set first = cur_layer == 1 %}
  {% else %}
    {% set first = printer.gcode_move.gcode_position.z|float <= cfg.first_layer_max_z|float %}
  {% endif %}
  {% if params.TEMP|default(0)|float > 0 %}
    {% set temp = params.TEMP|float %}
  {% elif material.startswith("PETG") %}
    {% set temp = cfg.temp_petg|float %}
  {% elif material.startswith("PLA") %}
    {% set temp = cfg.temp_pla|float %}
  {% else %}
    {% set temp = printer.extruder.target|float %}
  {% endif %}
  {% if params.OLD_TEMP|default(0)|float > 0 %}
    {% set old_temp = params.OLD_TEMP|float %}
  {% else %}
    {% set old_temp = printer.extruder.target|float %}
  {% endif %}
  {% if params.PURGE|default(0)|float > 0 %}
    {% set purge = [[params.PURGE|float, cfg.purge_min|float]|max, cfg.purge_max|float]|min %}
  {% else %}
    {% set purge = cfg.purge_default|float %}
  {% endif %}
  {% set retract = [params.RETRACT|default(0)|float, 0.0]|max %}
  {% if printer.pause_resume.is_paused and state|int > 0 %}
  RESPOND TYPE=error MSG="A color swap is already waiting. Finish it from the prompt (COLOR_SWAP_PROMPT reopens it)."
  _CS_SHOW_PROMPT
  {% elif printer.print_stats.state != "printing" %}
  RESPOND TYPE=error MSG="COLOR_SWAP only works during a print."
  {% elif temp < 170 or old_temp < 170 %}
  RESPOND TYPE=error MSG="COLOR_SWAP: nozzle {old_temp|int}C -> {temp|int}C is too cold to swap filament safely."
  {% else %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=1
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=temp VALUE={temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=old_temp VALUE={old_temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=bed VALUE={printer.heater_bed.target|default(0)}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=fan VALUE={printer.fan.speed}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purge VALUE={purge}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=slot VALUE={params.SLOT|default(0)|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=material VALUE='"{material}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=old_material VALUE='"{old_material}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=retract VALUE={retract}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=hold VALUE={[retract, 1.0]|max}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=z_floor VALUE={printer.toolhead.position.z}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sx VALUE={printer.gcode_move.gcode_position.x}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sy VALUE={printer.gcode_move.gcode_position.y}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sz VALUE={printer.gcode_move.gcode_position.z}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=se VALUE={printer.gcode_move.gcode_position.e}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sabse VALUE={1 if printer.gcode_move.absolute_extrude else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='"{main}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=first VALUE={1 if first else 0}
  SET_IDLE_TIMEOUT TIMEOUT={cfg.wait_timeout}
  # Lock the head: full holding current while you push filament in.
  _CS_HOLD ON=1
  # Pulling the old filament out would otherwise fire the runout sensor and M600.
  _CS_SENSOR ENABLE=0
  PAUSE X={cfg.park_x} Y={cfg.park_y} Z={cfg.park_lift} MIN_Z={cfg.park_min_z}
  M106 S0
  # Start heating to the purge temperature NOW, before the unload, so the nozzle is
  # ready when Load + purge is pressed. It is never below the old filament's
  # temperature, so the unload below is still done hot.
  M104 S{[old_temp, temp]|max}
  # Unload the OLD filament (at least at its own temperature, never cold).
  # Already retracted: RETRACT by the slicer + 1 mm by PAUSE.
  _CS_UNLOAD_STEPS TEMP={old_temp} PRE={retract + 1.0} RAM=1
  _CS_SHOW_PROMPT
  _CS_ALERT MSG="Color swap: insert filament {params.SLOT|default('next')} {material}, then press Load + purge"
  # Save the resume point once the file has stopped right after this line.
  UPDATE_DELAYED_GCODE ID=_CS_SWAP_CHECKPOINT DURATION=1
  {% endif %}


[gcode_macro COLOR_SWAP_PROMPT]
description: Reopen the color swap window (if you closed it in Mainsail or KlipperScreen)
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  {% else %}
  RESPOND MSG="No color swap is waiting."
  {% endif %}


[gcode_macro _CS_UNLOAD_STEPS]
description: Helper - heat, form a clean tip and pull the filament out. Not for direct use.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set temp = params.TEMP|default(printer.extruder.target)|float %}
  {% set pre = params.PRE|default(0)|float %}
  {% set ram = params.RAM|default(0)|int %}
  {% set snap = [13.0, cfg.unload_mm|float]|min %}
  {% if temp < 170 %}
  RESPOND TYPE=error MSG="Unload refused: {temp|int}C is too cold - pulling cold filament jams the nozzle."
  {% else %}
  # Wait until it is really hot: a filament pulled while cooling jams the nozzle.
  # "At least TEMP": a higher target already set (purge temperature) is kept.
  {% if printer.extruder.target|float < temp %}
  M104 S{temp}
  {% endif %}
  RESPOND MSG="Waiting for at least {(temp - 3)|int}C before unloading..."
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3}
  RESPOND MSG="Unloading filament..."
  M83
  {% if ram %}
  G1 E{pre + cfg.unload_purge_mm|float} F180
  {% endif %}
  G1 E-{snap} F1800
  G4 P{cfg.unload_dwell_ms|int}
  G1 E-{[cfg.unload_mm|float - snap, 0.0]|max} F800
  M400
  {% endif %}


[gcode_macro _CS_HEAT]
description: Helper - set the nozzle to TEMP and wait only until it is within heat_band degrees
gcode:
  # M109 waits until the temperature has SETTLED (within 1C and no longer moving),
  # which after a PID overshoot or a cool-down adds 10-40 s for nothing.
  # TEMPERATURE_WAIT returns as soon as the reading is inside the band.
  {% set t = params.TEMP|float %}
  {% set band = printer["gcode_macro _COLOR_SWAP_CFG"].heat_band|float %}
  M104 S{t}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - band} MAXIMUM={t + band}


[gcode_macro _CS_SHOW_PROMPT]
description: Helper - show the prompt for the current swap step in Mainsail and KlipperScreen
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set name = ("filament " ~ cs.slot) if cs.slot|int > 0 else "the next filament" %}
  {% set mat = (" (" ~ cs.material ~ ")") if cs.material else "" %}
  {% set change = cs.material and cs.old_material and cs.material != cs.old_material %}
  {% set to_main = cs.main_material and cs.material == cs.main_material and cs.old_material and cs.old_material != cs.main_material %}
  {% set total = cs.purge|float + (cfg.purge_material_change|float if change else 0.0) + (cfg.purge_to_main_extra|float if to_main else 0.0) %}
  {% set why = (" (+" ~ cfg.purge_to_main_extra|int ~ " back to the main filament)") if to_main else "" %}
  {% set purge_temp = [cs.temp|float, cs.old_temp|float]|max %}
  {% set mid = cfg.purge_buttons[1] if cfg.purge_buttons|length > 1 else cfg.purge_buttons[0] %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if cs.state|int == 0 %}
  {% elif cs.view == "confirm" %}
  # Two steps to continue. "Back" sits where "Continue..." was, so a double tap is harmless.
  RESPOND TYPE=command MSG="action:prompt_begin Color swap - continue?"
  RESPOND TYPE=command MSG="action:prompt_text Color clean and the strand cut off at the nozzle? The print continues straight away."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_CS_BACK"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, continue print|RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif cs.view == "cancel" %}
  RESPOND TYPE=command MSG="action:prompt_begin Color swap - cancel?"
  {% if cs.state|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_text The old filament is already out of the nozzle, so it is safe to pull by hand. Cancel print turns the heaters off and parks."
  RESPOND TYPE=command MSG="action:prompt_button Cancel print|_CS_CANCEL_PRINT UNLOAD=0|error"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Leave the filament in (do not pull it once cold - use UNLOAD_FILAMENT, it heats first), or unload it hot now and then cancel."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Cancel print|_CS_CANCEL_PRINT UNLOAD=0|error"
  RESPOND TYPE=command MSG="action:prompt_button Unload hot + cancel|_CS_CANCEL_PRINT UNLOAD=1|error"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back to the swap|_CS_BACK|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif cs.state|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_begin Color swap - load {name}"
  # One prompt_text per prompt: KlipperScreen shows only the last one.
  RESPOND TYPE=command MSG="action:prompt_text Pull the old filament out, insert {name}{mat}, then press Load + purge. Purge {total|round(0)|int} mm{why} at {purge_temp|int}C, print at {cs.temp|int}C. The bed temperature is not changed."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button PLA {cfg.temp_pla|int}C|_CS_SET_MATERIAL MATERIAL=PLA|secondary"
  RESPOND TYPE=command MSG="action:prompt_button PETG {cfg.temp_petg|int}C|_CS_SET_MATERIAL MATERIAL=PETG|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Head moved? Re-home|_CS_REHOME|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel...|_CS_CANCEL_MENU|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Unload again|_CS_UNLOAD"
  RESPOND TYPE=command MSG="action:prompt_footer_button Load + purge|_CS_LOAD|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_begin Color swap - check the purge"
  RESPOND TYPE=command MSG="action:prompt_text Color clean? Cut the strand off at the nozzle with tweezers (do not yank it), then Continue. Not clean yet? Purge more."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for mm in cfg.purge_buttons %}
  RESPOND TYPE=command MSG="action:prompt_button Purge +{mm|int}mm|_CS_PURGE_MORE MM={mm}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Head moved? Re-home|_CS_REHOME|warning"
  # Footer layout (version 5): the right-hand slot, where "Load + purge" was a moment
  # ago, is now a harmless "Purge" - a second tap there purges, it never continues.
  # "Continue..." is on the left and only opens a confirmation.
  RESPOND TYPE=command MSG="action:prompt_footer_button Continue...|_CS_CONFIRM|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel...|_CS_CANCEL_MENU|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Purge +{mid|int}mm|_CS_PURGE_MORE MM={mid}|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_BUSY]
description: Helper - show a window with no buttons while the printer works, so nothing can be pressed by mistake
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Please wait')}"
  RESPOND TYPE=command MSG="action:prompt_text {params.MSG|default('Working - do not press anything.')}"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CS_CONFIRM]
description: Prompt button - ask once more before the print continues
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int == 2 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"confirm"'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_PURGE_PULSES]
description: Helper - purge MM mm in chunks with a quick pull-back and push between them
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set mm = params.MM|float %}
  {% set step = cfg.purge_pulse_mm|float %}
  {% set back = cfg.purge_pulse_retract|float %}
  {% set n = ((mm / step)|round(0, 'ceil')|int) if step > 0 else 1 %}
  {% set n = [n, 1]|max %}
  {% set chunk = mm / n %}
  M83
  {% for i in range(n) %}
  G1 E{chunk} F{cfg.purge_speed}
  {% if back > 0 and i < n - 1 %}
  G1 E-{back} F2400
  G1 E{back} F2400
  {% endif %}
  {% endfor %}


[gcode_macro _CS_SET_MATERIAL]
description: Prompt button - switch the print temperature to the PLA or PETG preset
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set material = params.MATERIAL|default("PLA")|upper %}
  {% set temp = cfg.temp_petg if material == "PETG" else cfg.temp_pla %}
  {% if cs.state|int == 1 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=temp VALUE={temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=material VALUE='"{material}"'
  M104 S{[cs.old_temp|float, temp|float]|max}
  RESPOND MSG="Next filament: {material} at {temp|int}C"
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_UNLOAD]
description: Prompt button - pull the old filament out again (hot)
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 %}
  _CS_BUSY TITLE="Color swap - unloading" MSG="Heating, then pulling the filament out. Wait - do not press anything."
  _CS_UNLOAD_STEPS TEMP={cs.old_temp} RAM=0
  M104 S{[cs.old_temp|float, cs.temp|float]|max}
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_LOAD]
description: Prompt button - load the new filament and purge it in the air at the right temperature
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set change = cs.material and cs.old_material and cs.material != cs.old_material %}
  {% set to_main = cs.main_material and cs.material == cs.main_material and cs.old_material and cs.old_material != cs.main_material %}
  {% set purge = cs.purge|float + (cfg.purge_material_change|float if change else 0.0) + (cfg.purge_to_main_extra|float if to_main else 0.0) %}
  {% set purge_temp = [cs.temp|float, cs.old_temp|float]|max %}
  {% set cooler = cs.temp|float < purge_temp - 2 %}
  {% set slow = [cfg.load_slow_mm|float, cfg.load_mm|float]|min %}
  {% if cs.state|int == 1 %}
  # No buttons while it works: a second tap cannot land on anything.
  _CS_BUSY TITLE="Color swap - loading" MSG="Heating to {purge_temp|int}C, loading, then purging {purge|round(0)|int} mm. Wait - do not press anything."
  RESPOND MSG="Heating to {purge_temp|int}C..."
  _CS_HEAT TEMP={purge_temp}
  RESPOND MSG="Loading, then purging {purge|round(0)|int}mm..."
  M83
  G1 E{cfg.load_mm|float - slow} F{cfg.load_speed}
  G1 E{slow} F{cfg.purge_speed}
  _CS_PURGE_PULSES MM={purge}
  {% if cooler %}
  # Hotter old plastic is out; now settle the flow at the new, cooler temperature.
  RESPOND MSG="Cooling to {cs.temp|int}C for the new filament..."
  # The part fan speeds up the cooling; the nozzle is empty of print, nothing to spoil.
  M106 S255
  _CS_HEAT TEMP={cs.temp}
  M106 S0
  G1 E{cfg.settle_mm} F{cfg.purge_speed}
  {% endif %}
  G1 E-{cs.hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=2
  _CS_SHOW_PROMPT
  _CS_ALERT MSG="Purge done: check the color, cut the strand, then Continue"
  {% endif %}


[gcode_macro _CS_PURGE_MORE]
description: Prompt button - purge MM more mm of the new color
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set mm = [[params.MM|default(cfg.purge_buttons[0])|float, 1.0]|max, 300.0]|min %}
  {% if cs.state|int == 2 %}
  _CS_BUSY TITLE="Color swap - purging" MSG="Purging {mm|int} mm. Wait - do not press anything."
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_HEAT TEMP={cs.temp}
  RESPOND MSG="Purging {mm|int}mm..."
  M83
  G1 E{cs.hold} F2100
  _CS_PURGE_PULSES MM={mm}
  G1 E-{cs.hold} F2400
  M400
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_CANCEL_MENU]
description: Prompt button - show the cancel choices
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"cancel"'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_BACK]
description: Prompt button - back from the cancel choices to the swap
gcode:
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT


[gcode_macro _CS_CANCEL_PRINT]
description: Prompt button - cancel the print safely; UNLOAD=1 pulls the loaded filament out while hot first
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int > 0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if params.UNLOAD|default(0)|int == 1 and cs.state|int == 2 %}
  _CS_UNLOAD_STEPS TEMP={cs.temp} PRE={cs.hold} RAM=1
  RESPOND MSG="Filament unloaded hot - you can pull it out now."
  {% endif %}
  CANCEL_PRINT
  {% endif %}


[gcode_macro _COLOR_SWAP_ON_RESUME]
description: Helper called by RESUME - refuses to resume an unloaded swap, then reprimes, flicks and restores fan and sensor
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 %}
  # Klipper renders a whole macro before running it, so the error lives in its own
  # macro - otherwise it would fire before the prompt line runs.
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  _CS_REFUSE_RESUME
  {% elif cs.state|int == 2 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  _CS_HEAT TEMP={cs.temp}
  # The bed is never changed by a swap; this re-asserts the first filament's bed temperature.
  {% if cs.bed|float > 0 %}
  M140 S{cs.bed}
  {% endif %}
  {% if cs.first|int == 1 and printer["gcode_macro _COLOR_SWAP_CFG"].first_layer_wipe|int == 1 %}
  # Layer 1 only: prime with a short arc on the bed edge (it falls back to the
  # plain reprime when the arc cannot be drawn safely).
  _CS_WIPE_LINE
  {% else %}
  _CS_REPRIME
  {% endif %}
  M106 S{(cs.fan|float * 255)|round|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_slot VALUE={cs.slot|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_material VALUE='"{cs.material}"'
  _COLOR_SWAP_RESET
  {% endif %}


[gcode_macro _CS_REPRIME]
description: Helper - refill the nozzle, retract exactly what the slicer will push back, then flick the strand off
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  M83
  G1 E{cs.hold|float + cfg.reprime_mm|float} F{cfg.purge_speed}
  G1 E-{cs.retract} F2400
  M400
  {% if cfg.flick|int == 1 %}
  _CS_FLICK
  {% endif %}


[gcode_macro _CS_FLICK]
description: Helper - cool the strand with the part fan and snap it off with short side moves at the park height
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set th = printer.toolhead %}
  {% set d = cfg.flick_mm|float %}
  {% set x, y, z = th.position.x|float, th.position.y|float, th.position.z|float %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  # Delta printers: stay inside print_radius and below the cone (above it only X0 Y0
  # is reachable). Others: inside the axis limits.
  {% set radius = printer.configfile.settings.printer.print_radius|default(0)|float %}
  {% set in_radius = radius <= 0 or ((x|abs + d)**2 + y**2)**0.5 <= radius - 2 %}
  {% set in_box = x - d >= lo.x and x + d <= hi.x %}
  {% set below_cone = z <= th.cone_start_z|default(hi.z)|float %}
  {% if in_radius and in_box and below_cone %}
  M106 S255
  G4 P{cfg.flick_cool_ms|int}
  # Sideways only, relative X moves - Z is not touched.
  G91
  G1 X{d} F18000
  G1 X-{2 * d} F18000
  G1 X{2 * d} F18000
  G1 X-{d} F18000
  G90
  M400
  {% else %}
  RESPOND MSG="Flick skipped: the park point is too close to the edge."
  {% endif %}


[gcode_macro _CS_WIPE_LINE]
description: Helper - layer 1 only - prime with a short arc on the bed edge, then lift back to the park height
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set th = printer.toolhead %}
  {% set cx, cy = cfg.wipe_center_x|float, cfg.wipe_center_y|float %}
  {% set r = cfg.wipe_radius|float - cs.wipe_count|int * cfg.wipe_step|float %}
  {% set objs = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  # Outlines are convex, so if every corner is inside radius R the whole model is.
  {% set ns = namespace(reach=0.0) %}
  {% for o in objs %}
    {% for p in o.polygon|default([]) %}
      {% set ns.reach = [ns.reach, ((p[0] - cx)**2 + (p[1] - cy)**2)**0.5]|max %}
    {% endfor %}
  {% endfor %}
  # Arc from -85 to -45 degrees (40 degrees = 0.698 rad), counter-clockwise about the centre.
  {% set x0, y0 = cx + r * 0.087156, cy - r * 0.996195 %}
  {% set x1, y1 = cx + r * 0.707107, cy - r * 0.707107 %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  {% set inside = [x0, x1]|min >= lo.x and [x0, x1]|max <= hi.x and [y0, y1]|min >= lo.y and [y0, y1]|max <= hi.y %}
  {% set cone_z = th.cone_start_z|default(hi.z)|float %}
  # Layer 1 only, so the arc at wipe_z (0.3) is not lower than the layer itself (0.2).
  {% set wz = cfg.wipe_z|float %}
  {% if objs|length == 0 %}
  RESPOND MSG="Wipe line skipped: no object outlines in this G-code (enable Label objects in OrcaSlicer)."
  _CS_REPRIME
  {% elif ns.reach + cfg.wipe_margin|float > r %}
  RESPOND MSG="Wipe line skipped: the model reaches {ns.reach|round(1)} mm from the centre, closer than {cfg.wipe_margin|int} mm to the line at {r|round(1)} mm."
  _CS_REPRIME
  {% elif not inside %}
  RESPOND MSG="Wipe line skipped: the arc leaves the axis limits - check wipe_center_x, wipe_center_y and wipe_radius."
  _CS_REPRIME
  {% elif th.position.z > cone_z %}
  RESPOND MSG="Wipe line skipped: parked above the delta cone."
  _CS_REPRIME
  {% else %}
  {% set e = r * 0.698132 * cfg.wipe_e_per_mm|float %}
  {% set z_back = th.position.z %}
  RESPOND MSG="Layer 1 wipe line at radius {r|round(1)} mm..."
  M83
  G1 E{cs.hold|float + cfg.reprime_mm|float} F{cfg.purge_speed}
  # Sideways at the park height (above the model), down at the bed edge, arc, up again.
  G90
  G1 X{x0} Y{y0} F6000
  G1 Z{wz} F1500
  G3 X{x1} Y{y1} I{cx - x0} J{cy - y0} E{e} F{cfg.wipe_speed}
  # Retract exactly what the slicer pushes back after the swap.
  G1 E-{cs.retract} F2400
  G1 Z{z_back} F1500
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE={cs.wipe_count|int + 1}
  {% endif %}


[gcode_macro _CS_REFUSE_RESUME]
description: Helper - stop RESUME while the new filament is not loaded
gcode:
  {action_raise_error("Color swap: the new filament is not loaded yet - press Load + purge first.")}


[gcode_macro _COLOR_SWAP_RESET]
description: Helper - clear the swap state and turn the runout sensor back on
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  {% endif %}
  _CS_SENSOR ENABLE=1
  _CS_HOLD ON=0


[gcode_macro _CS_SENSOR]
description: Helper - switch the runout sensor named in _COLOR_SWAP_CFG on or off, if the printer has it
gcode:
  {% set name = printer["gcode_macro _COLOR_SWAP_CFG"].sensor %}
  {% if name and (("filament_switch_sensor " ~ name) in printer or ("filament_motion_sensor " ~ name) in printer) %}
  SET_FILAMENT_SENSOR SENSOR={name} ENABLE={params.ENABLE|default(1)|int}
  {% endif %}


# ---------------------------------------------------------------------------
# Version 4: head lock, re-home during a swap, resume points
# ---------------------------------------------------------------------------

[gcode_macro _CS_HOLD]
description: Helper - ON=1 holds the head motors at run current (head locked), ON=0 restores hold_current
gcode:
  # Pushing filament into a direct-drive extruder pushes the head. At hold_current
  # (0.5 A on the V400) the towers slip and the printer loses its position.
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set on = params.ON|default(1)|int == 1 %}
  {% set settings = printer.configfile.settings %}
  {% if cfg.hold_boost|int == 1 %}
  {% for st in cfg.hold_steppers %}
  {% for drv in ["tmc2209", "tmc2208", "tmc2130", "tmc2240", "tmc5160"] %}
  {% set key = drv ~ " " ~ st %}
  {% if key in settings and "hold_current" in settings[key] and "run_current" in settings[key] %}
  SET_TMC_CURRENT STEPPER={st} HOLDCURRENT={settings[key].run_current if on else settings[key].hold_current}
  {% endif %}
  {% endfor %}
  {% endfor %}
  {% endif %}


[gcode_macro _CS_REHOME]
description: Prompt button - the head was pushed and lost its place: home (straight up on a delta) and go back to the park point
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int > 0 and printer.pause_resume.is_paused %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.configfile.settings.printer.kinematics == "delta" %}
  # Delta endstops are at the top: homing only moves the head up, away from the part.
  RESPOND MSG="Re-homing: the head goes straight UP to the top, then back to the park point..."
  G28
  {% else %}
  # On most other printers homing Z moves DOWN onto the part: home X and Y only,
  # at the park height, which is above the model.
  RESPOND MSG="Re-homing X and Y at the park height..."
  G28 X Y
  {% endif %}
  _CS_GO_PARK Z={cs.z_floor}
  RESPOND MSG="Position restored. Continue print goes back to the exact point the print paused at."
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_GO_PARK]
description: Helper - right after homing, go to the park point above a model whose top is at Z. Not for direct use.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set th = printer.toolhead %}
  {% set zf = params.Z|float %}
  {% set max_z = th.axis_maximum.z|float %}
  {% set cone = th.cone_start_z|default(max_z)|float %}
  # Same height rule as PAUSE: park_lift above the model, at least park_min_z.
  {% set park_z = [[[zf + cfg.park_lift|float, cfg.park_min_z|float]|max, max_z - 10.0]|min, zf]|max %}
  G90
  {% if printer.configfile.settings.printer.kinematics == "delta" %}
  # Delta home is the top centre: come straight down the centre to the park
  # height (above the model), then out to the front edge.
  G1 X0 Y0 Z{park_z} F3000
  {% if park_z <= cone %}
  G1 X{cfg.park_x} Y{cfg.park_y} F6000
  {% endif %}
  {% else %}
  G1 X{cfg.park_x} Y{cfg.park_y} F6000
  {% endif %}
  M400


[gcode_macro _CS_CHECKPOINT]
description: Helper - save a resume point for RESUME_SAVED_PRINT (layer start from the slicer, or KIND=swap)
gcode:
  # One SAVE_VARIABLE per layer: the file position of this line plus everything
  # needed to continue from it (position, temperatures, fan, offsets, mesh...).
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set ps = printer.print_stats %}
  {% set g = printer.gcode_move %}
  {% set kind = params.KIND|default("layer")|lower %}
  {% set swap = kind == "swap" %}
  {% set info = ps.info|default({}) %}
  {% set layer = params.LAYER|default(info.current_layer|default(0, true))|int %}
  {% set total = params.TOTAL|default(info.total_layer|default(0, true))|int %}
  {% set file = ps.filename|default("") %}
  {% set bad = not file or "/" in file or "'" in file or '"' in file or "\\" in file %}
  {% if not swap and params.LAYER is defined and total > 0 %}
  SET_PRINT_STATS_INFO TOTAL_LAYER={total} CURRENT_LAYER={layer}
  {% endif %}
  {% if "save_variables" not in printer %}
  {% elif bad %}
  {% if swap or layer <= 1 %}
  RESPOND MSG="Resume points are not saved for this file: it must be in the main folder, with no quotes or backslashes in its name."
  {% endif %}
  {% elif swap and cs.state|int == 0 %}
  {% elif swap and ps.state != "paused" %}
  # The file has not stopped after the COLOR_SWAP line yet: try again in a second.
  UPDATE_DELAYED_GCODE ID=_CS_SWAP_CHECKPOINT DURATION=1
  {% elif not swap and ps.state != "printing" %}
  {% else %}
  {% set slot = cs.slot|int if swap else params.SLOT|default(cs.cur_slot)|int %}
  {% set mat = cs.material if swap else params.MATERIAL|default(cs.cur_material)|upper %}
  {% set cp = {
    "kind": kind if kind in ["swap", "auto"] else "layer",
    "file": file,
    "pos": printer.virtual_sdcard.file_position|int,
    "layer": layer,
    "total": total,
    "x": ((cs.sx if swap else g.gcode_position.x)|float)|round(3),
    "y": ((cs.sy if swap else g.gcode_position.y)|float)|round(3),
    "z": ((cs.sz if swap else g.gcode_position.z)|float)|round(3),
    "e": ((cs.se if swap else g.gcode_position.e)|float)|round(4),
    "abse": (cs.sabse if swap else (1 if g.absolute_extrude else 0))|int,
    "temp": ((cs.temp if swap else printer.extruder.target)|float)|round(1),
    "ptemp": (([cs.temp|float, cs.old_temp|float]|max if swap else printer.extruder.target)|float)|round(1),
    "bed": ((cs.bed if swap else (printer.heater_bed.target if "heater_bed" in printer else 0))|float)|round(1),
    "fan": ((cs.fan if swap else printer.fan.speed)|float)|round(3),
    "retract": ((cs.retract if swap else 0)|float)|round(3),
    "slot": slot,
    "mat": mat,
    "offz": (g.homing_origin.z|float)|round(4),
    "sf": (g.speed_factor|float)|round(3),
    "ef": (g.extrude_factor|float)|round(3),
    "pa": (printer.extruder.pressure_advance|float)|round(4),
    "st": (printer.extruder.smooth_time|float)|round(4),
    "mesh": printer.bed_mesh.profile_name if "bed_mesh" in printer else "",
    "excl": printer.exclude_object.excluded_objects if "exclude_object" in printer else []
  } %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE="{cp}"
  {% if swap %}
  RESPOND MSG="Resume point saved at this color swap (RESUME_SAVED_PRINT)."
  {% endif %}
  {% endif %}


[delayed_gcode _CS_SWAP_CHECKPOINT]
gcode:
  # Runs 1 s after COLOR_SWAP: by then the file has stopped after the COLOR_SWAP
  # line, so the saved position continues right after the swap.
  _CS_CHECKPOINT KIND=swap


[delayed_gcode _CS_AUTOSAVE]
# Power-loss save, independent of the slicer: every autosave_s seconds while a
# print runs. It only runs between two G-code lines, so the saved file position and
# the saved nozzle position always belong together.
initial_duration: 30
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cfg.autosave_s|int > 0 %}
  {% if printer.print_stats.state == "printing" and printer.virtual_sdcard.is_active and cs.state|int == 0 and cs.done|int == 0 %}
  _CS_CHECKPOINT KIND=auto
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_CS_AUTOSAVE DURATION={cfg.autosave_s|int}
  {% endif %}


[delayed_gcode _CS_BOOT_CHECK]
# After a power cut: when the printer starts and an unfinished print is saved,
# open the resume window by itself (late enough for KlipperScreen to be running).
initial_duration: 60
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  {% if cfg.boot_prompt|int == 1 and cp is mapping and printer.print_stats.state not in ["printing", "paused"] %}
  RESPOND MSG="An unfinished print is saved ({cp.file}). Resume it with RESUME_SAVED_PRINT, or delete the point."
  RESUME_SAVED_PRINT
  _CS_ALERT MSG="Printer started with an unfinished print saved ({cp.file}) - open Resume saved"
  {% endif %}


[gcode_macro _CS_CLEAR_CHECKPOINT]
description: Helper - forget the resume point (START_PRINT; END_PRINT passes DONE=1)
gcode:
  {% if "save_variables" in printer and printer.save_variables.variables.cs_resume|default(0) is mapping %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE=0
  {% endif %}
  # A new print starts (or one ends): forget its main filament and first-layer arcs.
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=done VALUE={1 if params.DONE|default(0)|int == 1 else 0}


[gcode_macro _CS_PROMPT_CLOSE]
description: Prompt button - close the window
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro RESUME_SAVED_PRINT]
description: Continue a stopped print (cancelled at a color swap, head moved, power cut) from its last saved point
# step: 0 not started, 1 homed and hot at the park point, waiting for load / purge
variable_step: 0
# loaded: 0 after Unload until Load + purge. hold: mm the filament is retracted.
variable_loaded: 1
variable_hold: 0
# confirm: 1 while the "continue?" question is shown
variable_confirm: 0
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
  RESPOND TYPE=error MSG="A print is running or paused - RESUME_SAVED_PRINT is for a print that has stopped."
  {% else %}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_CONFIRM]
description: Resume button - ask once more before the file continues (ON=0 goes back)
gcode:
  {% if printer["gcode_macro RESUME_SAVED_PRINT"].step|int == 1 %}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE={params.ON|default(1)|int}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_SHOW]
description: Helper - show the RESUME_SAVED_PRINT window for the current step
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if cp is not mapping %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume saved print"
  RESPOND TYPE=command MSG="action:prompt_text No saved point. One is saved every minute while printing, at every color swap, and at every layer start (Orca _CS_CHECKPOINT line)."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_PROMPT_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif rs.step|int == 1 and rs.confirm|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume - continue?"
  RESPOND TYPE=command MSG="action:prompt_text Right filament in, purge clean, strand cut off? The head goes above the part to the saved point and the print continues."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_CS_RS_CONFIRM ON=0"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, continue print|_CS_RS_GO|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif rs.step|int == 0 %}
  {% if cp.kind == "swap" %}
  {% set where = "color swap to filament " ~ cp.slot %}
  {% elif cp.kind == "auto" %}
  {% set where = "during layer " ~ cp.layer if cp.layer|int > 0 else "mid-print" %}
  {% else %}
  {% set where = "start of layer " ~ cp.layer %}
  {% endif %}
  {% set of = (" of " ~ cp.total) if cp.total|int > 0 else "" %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume saved print"
  RESPOND TYPE=command MSG="action:prompt_text {cp.file} - {where}{of}, Z {cp.z|round(2)}. Only if the part is still stuck to the bed and nothing touches the nozzle (lift the head by hand if it dropped). Start heats the bed, homes (the head goes UP), parks at the front edge and heats the nozzle."
  RESPOND TYPE=command MSG="action:prompt_footer_button Delete point|_CS_RS_CLEAR|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_PROMPT_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_footer_button Start|_CS_RS_PREP|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  {% set mat = (" (" ~ cp.mat ~ ")") if cp.mat else "" %}
  {% set name = ("filament " ~ cp.slot) if cp.slot|int > 0 else "the filament" %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume - {name}{mat}"
  {% if rs.loaded|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_text {name|capitalize}{mat} must be in the nozzle. Already in: Purge until it runs clean. Wrong or none: Unload, insert it, Load + purge. Cut the strand at the nozzle, then Continue print."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for mm in cfg.purge_buttons %}
  RESPOND TYPE=command MSG="action:prompt_button Purge +{mm|int}mm|_CS_RS_PURGE MM={mm}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text The filament is out. Insert {name}{mat}, then Load + purge."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Unload|_CS_RS_UNLOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Load + purge|_CS_RS_LOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Cancel resume|_CS_RS_CANCEL|error"
  # Same safe layout as the swap: "Continue..." on the left opens a question; the
  # right-hand slot (where "Start" was) only purges.
  {% set mid = cfg.purge_buttons[1] if cfg.purge_buttons|length > 1 else cfg.purge_buttons[0] %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Continue...|_CS_RS_CONFIRM|primary"
  {% if rs.loaded|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Purge +{mid|int}mm|_CS_RS_PURGE MM={mid}|secondary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_RS_PREP]
description: Resume button - heat, home (straight up), restore the Z offset and mesh, park and heat the nozzle
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  {% set th = printer.toolhead %}
  {% set max_z = th.axis_maximum.z|float %}
  {% set cone = th.cone_start_z|default(max_z)|float %}
  {% if cp is not mapping %}
  RESPOND TYPE=error MSG="No saved point to resume."
  {% elif printer.print_stats.state in ["printing", "paused"] %}
  RESPOND TYPE=error MSG="A print is running."
  {% elif printer.configfile.settings.printer.kinematics != "delta" %}
  RESPOND TYPE=error MSG="RESUME_SAVED_PRINT is for delta printers only: their homing moves up, away from the part."
  {% elif [cp.z|float + cfg.park_lift|float, cfg.park_min_z|float]|max > cone - 1 %}
  RESPOND TYPE=error MSG="The saved point (Z {cp.z|round(1)}) is too high to park beside the part - it cannot be resumed."
  {% elif cp.temp|float < 170 %}
  RESPOND TYPE=error MSG="The saved nozzle temperature ({cp.temp|int}C) is too low to print."
  {% else %}
  # Heat to the print temperature of the filament that should be in the nozzle.
  # Unload and Load + purge go hotter themselves when the old filament needs it.
  {% set ptemp = cp.temp|float %}
  _CS_BUSY TITLE="Resume - preparing" MSG="Heating the bed, homing (the head goes UP), parking at the front edge, heating the nozzle. Several minutes - do not press anything."
  # Fails here, before anything moves, if the file is gone.
  M23 {cp.file}
  SET_IDLE_TIMEOUT TIMEOUT={cfg.wait_timeout}
  {% if cp.bed|float > 0 %}
  M140 S{cp.bed}
  {% endif %}
  M104 S{ptemp}
  RESPOND MSG="Homing: the head goes straight UP to the top..."
  G28
  SET_GCODE_OFFSET Z={cp.offz}
  {% if "bed_mesh" in printer %}
  {% set bm = printer.bed_mesh %}
  {% if not cp.mesh %}
  BED_MESH_CLEAR
  {% elif bm.profile_name == cp.mesh %}
  {% elif cp.mesh in bm.profiles %}
  BED_MESH_PROFILE LOAD={cp.mesh}
  {% elif "default" in bm.profiles %}
  RESPOND MSG="Mesh {cp.mesh} is gone (an adaptive mesh is lost at restart) - using default. Above the mesh fade height it makes no difference."
  BED_MESH_PROFILE LOAD=default
  {% endif %}
  {% endif %}
  _CS_GO_PARK Z={cp.z}
  _CS_HOLD ON=1
  {% if cp.bed|float > 0 %}
  RESPOND MSG="Heating the bed to {cp.bed|int}C..."
  M190 S{cp.bed}
  {% endif %}
  RESPOND MSG="Heating the nozzle to {ptemp|int}C..."
  _CS_HEAT TEMP={ptemp}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE=0
  _CS_RS_SHOW
  _CS_ALERT MSG="Resume ready: printer hot and parked - purge, cut the strand, then Continue"
  {% endif %}


[gcode_macro _CS_RS_PURGE]
description: Resume button - purge MM mm of the filament that is in the nozzle
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set mm = [[params.MM|default(cfg.purge_buttons[0])|float, 1.0]|max, 300.0]|min %}
  {% set hold = [cp.retract|float, 1.0]|max %}
  {% if rs.step|int == 1 and rs.loaded|int == 1 %}
  _CS_BUSY TITLE="Resume - purging" MSG="Purging {mm|int} mm. Wait - do not press anything."
  _CS_HEAT TEMP={cp.temp}
  RESPOND MSG="Purging {mm|int}mm..."
  M83
  {% if rs.hold|float > 0 %}
  G1 E{rs.hold} F2100
  {% endif %}
  _CS_PURGE_PULSES MM={mm}
  G1 E-{hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE={hold}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_UNLOAD]
description: Resume button - pull the filament out (hot)
gcode:
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set ptemp = [cp.temp|float, cp.ptemp|default(0)|float]|max %}
  {% if rs.step|int == 1 %}
  _CS_BUSY TITLE="Resume - unloading" MSG="Heating, then pulling the filament out. Wait - do not press anything."
  _CS_UNLOAD_STEPS TEMP={ptemp} PRE={rs.hold} RAM=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE=0
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_LOAD]
description: Resume button - load the filament slowly and purge it
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set ptemp = [cp.temp|float, cp.ptemp|default(0)|float]|max %}
  {% set hold = [cp.retract|float, 1.0]|max %}
  {% if rs.step|int == 1 %}
  _CS_BUSY TITLE="Resume - loading" MSG="Heating, loading slowly, then purging. Wait - do not press anything."
  _CS_HEAT TEMP={ptemp}
  RESPOND MSG="Loading slowly, then purging {cfg.purge_default|int}mm..."
  M83
  # All at purge speed: safe even if the filament was already in the nozzle.
  G1 E{cfg.load_mm} F{cfg.purge_speed}
  _CS_PURGE_PULSES MM={cfg.purge_default}
  {% if cp.temp|float < ptemp - 2 %}
  M106 S255
  _CS_HEAT TEMP={cp.temp}
  M106 S0
  G1 E{cfg.settle_mm} F{cfg.purge_speed}
  {% endif %}
  G1 E-{hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE={hold}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_GO]
description: Resume button - reprime, flick, travel above the saved point and continue the file from it
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  # A swap point already includes the slicer's Z-hop; a layer point is the top of
  # the last finished layer, so stop resume_lift above it.
  # An "auto" point (power-loss save) is mid-layer: the next lines print without
  # setting Z, so the nozzle must be at exactly the saved height (where it was).
  {% set lift = cfg.resume_lift|float if cp.kind == "layer" else 0.0 %}
  {% set total = cp.total|default(0)|int %}
  {% if rs.step|int != 1 %}
  {% elif rs.loaded|int == 0 %}
  RESPOND TYPE=error MSG="The filament is out - insert it and press Load + purge first."
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  _CS_RS_SHOW
  {% else %}
  _CS_BUSY TITLE="Resume - continuing" MSG="Priming, then moving above the part to the saved point. The print continues by itself."
  _CS_HEAT TEMP={cp.temp}
  M83
  G1 E{rs.hold|float + cfg.reprime_mm|float} F{cfg.purge_speed}
  {% if cp.retract|float > 0 %}
  # A swap point continues with the slicer pushing RETRACT back in.
  G1 E-{cp.retract} F2400
  {% endif %}
  M400
  {% if cfg.flick|int == 1 %}
  _CS_FLICK
  {% endif %}
  M106 S{(cp.fan|float * 255)|round|int}
  # Sideways at the park height (above the model), then straight down to the point.
  G90
  G1 X{cp.x} Y{cp.y} F{cfg.resume_speed|float * 60}
  G1 Z{cp.z|float + lift} F1200
  {% if cp.abse|int == 1 %}
  M82
  G92 E{cp.e}
  {% else %}
  M83
  {% endif %}
  M220 S{(cp.sf|float * 100)|round(1)}
  M221 S{(cp.ef|float * 100)|round(1)}
  SET_PRESSURE_ADVANCE ADVANCE={cp.pa} SMOOTH_TIME={cp.st}
  _CS_HOLD ON=0
  SET_IDLE_TIMEOUT TIMEOUT=1800
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=done VALUE=0
  RESPOND MSG="Continuing {cp.file} from the saved point..."
  RESPOND TYPE=command MSG="action:prompt_end"
  # M23 resets the job (and the excluded objects), so they are restored after it.
  M23 {cp.file}
  {% for name in cp.excl %}
  EXCLUDE_OBJECT NAME={name}
  {% endfor %}
  {% if total > 0 %}
  SET_PRINT_STATS_INFO TOTAL_LAYER={total} CURRENT_LAYER={cp.layer|int}
  {% endif %}
  M26 S{cp.pos|int}
  M24
  {% endif %}


[gcode_macro _CS_RS_CANCEL]
description: Resume button - stop: heaters off, park at the top, keep the saved point
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=0
  M104 S0
  M140 S0
  M106 S0
  _CS_HOLD ON=0
  SDCARD_RESET_FILE
  SET_IDLE_TIMEOUT TIMEOUT=1800
  {% if "gcode_macro _SAFE_PARK" in printer %}
  _SAFE_PARK
  {% endif %}
  RESPOND MSG="Resume cancelled. The saved point is kept (RESUME_SAVED_PRINT)."


[gcode_macro _CS_RS_CLEAR]
description: Resume button - delete the saved point
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "save_variables" in printer %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE=0
  {% endif %}
  RESPOND MSG="Saved point deleted."


# ---------------------------------------------------------------------------
# Version 5.1: alerts (phone message + buzzer beep)
# ---------------------------------------------------------------------------

[gcode_macro _CS_ALERT]
description: Helper - phone message and beep for a stage; never stops the print (sent from timers)
variable_msg: ""
gcode:
  # Store the text, then send it from timers: a failed send (Moonraker restarting,
  # no notifier) is only logged by the timer and can never break a print or a swap.
  {% set text = params.MSG|default("The printer needs you")|replace('"', '')|replace("'", '') %}
  SET_GCODE_VARIABLE MACRO=_CS_ALERT VARIABLE=msg VALUE='"{text}"'
  UPDATE_DELAYED_GCODE ID=_CS_ALERT_SEND DURATION=0.2
  UPDATE_DELAYED_GCODE ID=_CS_BEEP_RUN DURATION=0.4


[delayed_gcode _CS_ALERT_SEND]
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% if cfg.notify_name %}
  {action_call_remote_method("notify", name=cfg.notify_name, message=printer["gcode_macro _CS_ALERT"].msg)}
  {% endif %}


[delayed_gcode _CS_BEEP_RUN]
gcode:
  _CS_BEEP


[gcode_macro _CS_BEEP]
description: Beep the buzzer (only if [output_pin beeper] exists, and never while the nozzle is printing)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set pin = cfg.beeper_pin %}
  {% set ms = cfg.beep_ms|int %}
  # A dwell between print moves would leave a blob, so no beep while a print runs
  # (swaps, resume and runout are all paused or idle when they alert).
  {% set running = printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
  {% if pin and ("output_pin " ~ pin) in printer and not running %}
  {% for i in range(cfg.beep_count|int) %}
  SET_PIN PIN={pin} VALUE=1
  G4 P{ms}
  SET_PIN PIN={pin} VALUE=0
  G4 P{ms}
  {% endfor %}
  {% endif %}


[gcode_macro TEST_ALERT]
description: Send a test phone message and beep (no movement)
gcode:
  _CS_ALERT MSG="Test alert from the FLSUN V400"
  RESPOND MSG="Test alert sent: check your phone (and listen for the buzzer, if one is fitted)."
