    ["autosave_s", "Save my place every", 10, 0, 600, " s", "After a power cut less than this much printing is lost. 0 switches saving off.", ""],
    ["boot_prompt", "Offer to resume at start-up", 0, 0, 1, "", "", ""],
    ["resume_lift", "Stop above a saved layer by", 0.1, 0, 5, " mm", "Safety gap before the file continues from a layer start.", ""]]],
  ["Park point", "setup", [
    ["park_auto", "Find the park point by itself", 0, 0, 1, "", "", ""],
    ["park_edge", "Distance from the front limit", 1, 0, 100, " mm", "Used by the automatic park point.", "park_auto"],
    ["park_x", "My own park X", 5, -500, 500, " mm", "Used only when the automatic park point is OFF.", "!park_auto"],
    ["park_y", "My own park Y", 5, -500, 500, " mm", "Used only when the automatic park point is OFF.", "!park_auto"],
    ["park_lift", "Lift above the print", 1, 1, 100, " mm", "The head goes up this far before it moves aside.", ""],
    ["park_min_z", "Never park lower than", 5, 0, 400, " mm", "Room for your hand and the purged plastic under the nozzle.", ""]]],
  ["Filament path", "setup", [
    ["unload_mm", "Length pulled out", 5, 0, 1500, " mm", "From the nozzle to where you can pull the filament by hand. Bowden: the tube length.", ""],
    ["load_mm", "Length pushed in", 5, 0, 1500, " mm", "From the extruder gears to the nozzle. Bowden: the tube length.", ""]]],
  ["This printer", "setup", [
    ["pause_retract_mm", "What RESUME pushes by itself", 0.5, 0, 10, " mm", "Mainsail, Fluidd and the V400 macros push 1 mm. A wrong value gives a blob or a gap after every swap.", ""],
    ["min_temp", "Never move filament below", 5, 150, 260, " C", "Protects against pulling cold filament, which jams the nozzle.", ""],
    ["resume_trust_z", "After a power cut trust Z", 0, 0, 1, "", "", "notdelta"]]]
  ]
gcode:
  RESPOND MSG="_CS_SCHEMA holds the settings window layout only."


[gcode_macro COLOR_SWAP]
description: Pause in place for a manual color change: park, unload, then load + purge from the prompt
# state: 0 idle, 1 waiting for the new filament, 2 loaded - check the purge
variable_state: 0
variable_view: ""
# 1 once the old filament has been pulled out
variable_unloaded: 0
# 1 when this is a runout / M600 and not a color change
variable_runout: 0
variable_temp: 0
variable_old_temp: 0
variable_bed: 0
variable_fan: 0
variable_purge: 0
variable_purge_total: 0
variable_to_main: 0
variable_slot: 0
variable_material: ""
variable_old_material: ""
variable_retract: 0
variable_hold: 1
variable_z_floor: 0
# Where the slicer stopped, in G-code coordinates (saved for RESUME_SAVED_PRINT).
variable_sx: 0
variable_sy: 0
variable_sz: 0
variable_se: 0
variable_sabse: 0
# Filament in the nozzle after the last finished swap.
variable_cur_slot: 0
variable_cur_material: ""
# The print's main filament: the one it started with (OLD_MATERIAL of its first swap).
variable_main_material: ""
# 1 when this swap is in layer 1 (wipe line); layer-1 lines drawn in this print.
variable_first: 0
variable_wipe_count: 0
# 1 after the print ended, so the power-loss autosave does not save a finished print.
variable_done: 0
# The job these counters belong to (a new file or a restarted clock = a new job).
variable_job_file: ""
variable_job_dur: 0
# Statistics of this print.
variable_swaps: 0
variable_purged: 0
variable_wait_total: 0
# Waiting clock (seconds): since the swap started / since the last button.
variable_waited: 0
variable_idle_s: 0
# 1 once any button was pressed in this swap (auto continue is then off).
variable_touched: 0
# 0 nozzle hot, 1 cooled to standby, 2 heater off
variable_standby: 0
# Worked out by _CS_DETECT: park point and the filament sensor object.
variable_px: 0
variable_py: 0
variable_sensor_obj: ""
# low, normal, high or custom: what the Purge amount button shows.
variable_purge_level: "normal"
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set ps = printer.print_stats %}
  {% set runout = params.RUNOUT|default(0)|int == 1 %}
  {% set paused = printer.pause_resume.is_paused %}
  {% set material = params.MATERIAL|default(cur_material if runout else "")|upper %}
  {% set old_material = params.OLD_MATERIAL|default(material if runout else "")|upper %}
  {% set fname = ps.filename|default("")|replace('"', '')|replace("'", '') %}
  {% set dur = ps.print_duration|default(0)|float %}
  {% set new_job = fname != job_file or dur + 1 < job_dur|float %}
  {% set main0 = "" if new_job else main_material %}
  {% set main = main0 if main0 else old_material %}
  {% set cur_layer = (ps.info|default({})).current_layer|default(0, true)|int %}
  {% if runout %}
    {% set first = false %}
  {% elif cur_layer > 0 %}
    {% set first = cur_layer == 1 %}
  {% else %}
    {% set first = printer.gcode_move.gcode_position.z|float <= cfg.first_layer_max_z|float %}
  {% endif %}
  {% set ns = namespace(preset=0.0) %}
  {% for m in ["PETG", "PLA", "ABS", "ASA", "TPU"] %}
    {% if ns.preset == 0 and material.startswith(m) %}
      {% set ns.preset = cfg["temp_" ~ m|lower]|float %}
    {% endif %}
  {% endfor %}
  {% if params.TEMP|default(0)|float > 0 %}
    {% set temp = params.TEMP|float %}
  {% elif ns.preset > 0 and not runout %}
    {% set temp = ns.preset %}
  {% else %}
    {% set temp = printer.extruder.target|float %}
  {% endif %}
  {% if params.OLD_TEMP|default(0)|float > 0 %}
    {% set old_temp = params.OLD_TEMP|float %}
  {% else %}
    {% set old_temp = printer.extruder.target|float %}
  {% endif %}
  {% if runout %}
    {% set purge = cfg.purge_min|float %}
  {% elif params.PURGE|default(0)|float > 0 %}
    {% set purge = [[params.PURGE|float, cfg.purge_min|float]|max, cfg.purge_max|float]|min %}
  {% else %}
    {% set purge = cfg.purge_default|float %}
  {% endif %}
  {% set retract = [params.RETRACT|default(0)|float, 0.0]|max %}
  {% set pr = cfg.pause_retract_mm|float %}
  {% set min_t = cfg.min_temp|float %}
  # The old filament stays in when auto continue is on: it is what the print goes on with.
  {% set do_unload = cfg.auto_unload|int == 1 and (runout or cfg.auto_continue_min|float <= 0) %}
  # A new MATERIAL type is never replaced by the old one without a person (v6.5).
  {% set mat_hold = not runout and material and old_material and material != old_material %}
  {% if state|int > 0 %}
  RESPOND TYPE=error MSG="A color swap is already waiting. Finish it from the prompt (COLOR_SWAP_PROMPT reopens it)."
  _CS_SHOW_PROMPT
  {% elif ps.state != "printing" and not (runout and ps.state == "paused") %}
  RESPOND TYPE=error MSG="COLOR_SWAP only works during a print."
  {% elif temp < min_t or old_temp < min_t %}
  RESPOND TYPE=error MSG="COLOR_SWAP: nozzle {old_temp|int}C -> {temp|int}C is too cold to swap filament safely."
  {% else %}
  {% if new_job %}
  _CS_NEW_JOB
  {% endif %}
  _CS_DETECT
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=1
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=unloaded VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=runout VALUE={1 if runout else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=temp VALUE={temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=old_temp VALUE={old_temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=bed VALUE={printer.heater_bed.target|default(0) if "heater_bed" in printer else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=fan VALUE={printer.fan.speed|default(0) if "fan" in printer else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purge VALUE={purge}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=slot VALUE={params.SLOT|default(cur_slot if runout else 0)|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=material VALUE='"{material}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=old_material VALUE='"{old_material}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=retract VALUE={retract}
  # Until the unload, the filament is back by what the slicer and PAUSE retracted.
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=hold VALUE={retract + pr}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=z_floor VALUE={printer.toolhead.position.z}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sx VALUE={printer.gcode_move.gcode_position.x}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sy VALUE={printer.gcode_move.gcode_position.y}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sz VALUE={printer.gcode_move.gcode_position.z}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=se VALUE={printer.gcode_move.gcode_position.e}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sabse VALUE={1 if printer.gcode_move.absolute_extrude else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='"{main}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=first VALUE={1 if first else 0}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_dur VALUE={dur}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=waited VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=idle_s VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=touched VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  _CS_CALC
  # Klipper's own idle timeout must not end the swap: the waiting clock (_CS_TICK)
  # cools the nozzle instead and leaves the bed and the motors on.
  SET_IDLE_TIMEOUT TIMEOUT={(cfg.wait_max_min|float * 60)|int}
  # Lock the head: full holding current while you push filament in.
  _CS_HOLD ON=1
  # Pulling the old filament out would otherwise fire the runout sensor.
  _CS_SENSOR ENABLE=0
  {% if not paused %}
  PAUSE
  # The printer's own PAUSE has lifted and parked somewhere; go to OUR park point
  # (up first, never down).
  _CS_PARK Z={printer.toolhead.position.z}
  {% endif %}
  M106 S0
  # HOME: start heating to the purge temperature NOW, before the unload. It is never
  # below the old filament's temperature, so the unload is still done hot.
  # AWAY: the swap may end with the OLD color (auto continue / Keep), so the nozzle stays
  # at the old filament's temperature; Unload starts the heating (v6.4).
  {% if do_unload or cfg.auto_continue_min|float <= 0 %}
  M104 S{[old_temp, temp]|max}
  {% else %}
  M104 S{old_temp}
  {% endif %}
  {% if do_unload %}
  # Unload the OLD filament (at least at its own temperature, never cold).
  _CS_UNLOAD_STEPS TEMP={old_temp} PRE={retract + pr} RAM=1
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=unloaded VALUE=1
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=hold VALUE=0
  {% endif %}
  _CS_SHOW_PROMPT
  {% if runout %}
  _CS_ALERT KIND=runout MSG="Filament runout: printer paused - insert filament, then Load + purge"
  {% elif do_unload %}
  _CS_ALERT KIND=swap MSG="Color swap: insert filament {params.SLOT|default('next')} {material}, then press Load + purge"
  {% elif cfg.auto_continue_min|float > 0 and mat_hold %}
  _CS_ALERT KIND=swap MSG="Color swap to filament {params.SLOT|default('next')} {material} is waiting. The material changes ({old_material} to {material}), so it will NOT continue by itself: press Unload at the printer (CS_KEEP goes on with {old_material} anyway)"
  {% elif cfg.auto_continue_min|float > 0 %}
  _CS_ALERT KIND=swap MSG="Color swap to filament {params.SLOT|default('next')} {material} is waiting. No action for {cfg.auto_continue_min|int} min = the print continues with the current color (CS_WAIT holds it)"
  {% else %}
  _CS_ALERT KIND=swap MSG="Color swap to filament {params.SLOT|default('next')} {material} is waiting: press Unload"
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_CS_TICK DURATION=10
  {% if not paused %}
  # Save the resume point once the file has stopped right after this line.
  UPDATE_DELAYED_GCODE ID=_CS_SWAP_CHECKPOINT DURATION=1
  {% endif %}
  {% endif %}


[gcode_macro COLOR_SWAP_RUNOUT]
description: Runout sensor / M600 - open the swap window for the SAME filament (use as runout_gcode)
gcode:
  COLOR_SWAP RUNOUT=1


[gcode_macro COLOR_SWAP_PROMPT]
description: Reopen the color swap window (if you closed it in Mainsail or KlipperScreen)
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  {% else %}
  RESPOND MSG="No color swap is waiting."
  {% endif %}


[gcode_macro _CS_NEW_JOB]
description: Helper - a new print started: forget the main filament, the layer-1 lines and the statistics
gcode:
  {% set ps = printer.print_stats %}
  {% set fname = ps.filename|default("")|replace('"', '')|replace("'", '') %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=swaps VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wait_total VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=done VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_file VALUE='"{fname}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_dur VALUE={ps.print_duration|default(0)|float}


[gcode_macro _CS_DETECT]
description: Helper - work out the park point and find the filament sensor (at start, at each swap, after a settings change)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set settings = printer.configfile.settings %}
  {% set th = printer.toolhead %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  {% set delta = settings.printer.kinematics == "delta" %}
  {% if cfg.park_auto|int == 1 %}
    {% set px = 0.0 if delta else (lo.x|float + hi.x|float) / 2 %}
    {% set py = lo.y|float + cfg.park_edge|float %}
  {% else %}
    {% set px = cfg.park_x|float %}
    {% set py = cfg.park_y|float %}
  {% endif %}
  # Never outside the limits, whatever was typed.
  {% set px = [[px, lo.x|float]|max, hi.x|float]|min %}
  {% set py = [[py, lo.y|float]|max, hi.y|float]|min %}
  {% set want = cfg.sensor|string %}
  {% set ns = namespace(obj="") %}
  {% for kind in ["filament_switch_sensor ", "filament_motion_sensor "] %}
    {% if not ns.obj and want|lower not in ["auto", ""] and (kind ~ want) in printer %}
      {% set ns.obj = kind ~ want %}
    {% endif %}
  {% endfor %}
  {% if not ns.obj and want|lower in ["auto", ""] %}
    {% for k in settings %}
      {% if not ns.obj and (k.startswith("filament_switch_sensor ") or k.startswith("filament_motion_sensor ")) and k in printer %}
        {% set ns.obj = k %}
      {% endif %}
    {% endfor %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=px VALUE={px|round(2)}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=py VALUE={py|round(2)}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=sensor_obj VALUE='"{ns.obj}"'
  # Which purge amount do the six purge values add up to? (LOW, NORMAL and HIGH are
  # 0.6, 1 and 1.8 times the values written in this file - see _CS_PURGE_LEVEL.)
  {% set sec = settings["gcode_macro _color_swap_cfg"]|default({}) %}
  {% set lv = namespace(name="custom") %}
  {% for nm, fac in [["low", 0.6], ["normal", 1.0], ["high", 1.8]] %}
    {% set m = namespace(ok=true) %}
    {% for k in ["purge_default", "purge_to_main_extra", "purge_material_change", "purge_btn1", "purge_btn2", "purge_btn3"] %}
      {% set d = sec["variable_" ~ k]|default(cfg[k])|float %}
      {% set want = d if fac == 1.0 else [((d * fac / 5)|round(0) * 5), 5]|max %}
      {% if cfg[k]|float != want %}
        {% set m.ok = false %}
      {% endif %}
    {% endfor %}
    {% if m.ok and lv.name == "custom" %}
      {% set lv.name = nm %}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purge_level VALUE='"{lv.name}"'


[gcode_macro _CS_CALC]
description: Helper - the one place where the purge length of this swap is worked out
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set change = cs.material and cs.old_material and cs.material != cs.old_material %}
  {% set to_main = cs.main_material and cs.material == cs.main_material and cs.old_material and cs.old_material != cs.main_material %}
  {% set total = cs.purge|float + (cfg.purge_material_change|float if change else 0.0) + (cfg.purge_to_main_extra|float if to_main else 0.0) %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purge_total VALUE={total}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=to_main VALUE={1 if to_main else 0}


[gcode_macro _CS_E]
description: Helper - extruder-only move of MM mm (negative pulls) at F mm/min, split so no piece is longer than max_extrude_only_distance
gcode:
  {% set mm = params.MM|float %}
  {% set f = [params.F|default(300)|float, 30.0]|max %}
  {% set lim = [(printer.configfile.settings.extruder|default({})).max_extrude_only_distance|default(50)|float - 1.0, 5.0]|max %}
  {% set n = [((mm|abs) / lim)|round(0, 'ceil')|int, 1]|max %}
  {% if mm|abs > 0.0001 %}
  M83
  {% for i in range(n) %}
  G1 E{(mm / n)|round(4)} F{f|round(0)|int}
  {% endfor %}
  {% endif %}


[gcode_macro _CS_PARK]
description: Helper - from wherever PAUSE left the head, go to the park point: up first, never down. Not for direct use.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set th = printer.toolhead %}
  {% set cur = th.position.z|float %}
  {% set zf = [params.Z|default(cur)|float, cs.z_floor|float]|max %}
  {% set max_z = th.axis_maximum.z|float %}
  {% set delta = printer.configfile.settings.printer.kinematics == "delta" %}
  {% set cone = th.cone_start_z|default(max_z)|float %}
  # park_lift above the model, at least park_min_z, never above the top, never down.
  {% set want = [cs.z_floor|float + cfg.park_lift|float, cfg.park_min_z|float]|max %}
  {% set park_z = [[want, max_z - 10.0]|min, cur]|max %}
  {% if "x" in th.homed_axes and "y" in th.homed_axes and "z" in th.homed_axes %}
  G90
  {% if delta and park_z > cone %}
  # Above the delta cone only the centre is reachable.
  G1 X0 Y0 F6000
  {% if park_z > cur + 0.01 %}
  G1 Z{park_z|round(3)} F3000
  {% endif %}
  {% else %}
  {% if park_z > cur + 0.01 %}
  G1 Z{park_z|round(3)} F3000
  {% endif %}
  G1 X{cs.px} Y{cs.py} F6000
  {% endif %}
  M400
  {% endif %}


[gcode_macro _CS_UNLOAD_STEPS]
description: Helper - heat, form a clean tip and pull the filament out. Not for direct use.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set temp = params.TEMP|default(printer.extruder.target)|float %}
  {% set pre = params.PRE|default(0)|float %}
  {% set ram = params.RAM|default(0)|int %}
  {% set snap = [cfg.unload_snap_mm|float, cfg.unload_mm|float]|min %}
  {% if temp < cfg.min_temp|float %}
  RESPOND TYPE=error MSG="Unload refused: {temp|int}C is too cold - pulling cold filament jams the nozzle."
  {% else %}
  # Wait until it is really hot: a filament pulled while cooling jams the nozzle.
  # "At least TEMP": a higher target already set (purge temperature) is kept.
  {% if printer.extruder.target|float < temp %}
  M104 S{temp}
  {% endif %}
  RESPOND TYPE=command MSG="Waiting for at least {(temp - 3)|int}C before unloading..."
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3}
  RESPOND TYPE=command MSG="Unloading filament..."
  M83
  {% if ram %}
  _CS_E MM={pre + cfg.unload_purge_mm|float} F=180
  {% endif %}
  # v6.6: one pull with no stop (as in v2). A 3 s stop after the quick pull let the
  # strand cool in the hot end and it came out hard. unload_dwell_ms > 0 brings it back.
  _CS_E MM=-{snap} F=1800
  {% if cfg.unload_dwell_ms|int > 0 %}
  G4 P{cfg.unload_dwell_ms|int}
  {% endif %}
  _CS_E MM=-{[cfg.unload_mm|float - snap, 0.0]|max} F=800
  M400
  {% endif %}


[gcode_macro _CS_HEAT]
description: Helper - set the nozzle to TEMP and wait only until it is within heat_band degrees
gcode:
  # M109 waits until the temperature has SETTLED, which after an overshoot or a
  # cool-down adds 10-40 s for nothing. TEMPERATURE_WAIT returns inside the band.
  # v6.4: a nozzle that is HOTTER than TEMP never waits to cool down - the filament
  # flows anyway and the nozzle reaches TEMP while it works. Only heating is waited for.
  {% set t = params.TEMP|float %}
  {% set band = printer["gcode_macro _COLOR_SWAP_CFG"].heat_band|float %}
  M104 S{t}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - band}


[gcode_macro _CS_TOUCH]
description: Helper - a button was pressed: restart the waiting clock and switch auto continue off
gcode:
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=idle_s VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=touched VALUE=1


[gcode_macro _CS_SHOW_PROMPT]
description: Helper - show the prompt for the current swap step in Mainsail and KlipperScreen
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set runout = cs.runout|int == 1 %}
  {% set name = ("filament " ~ cs.slot) if cs.slot|int > 0 else ("the filament" if runout else "the next filament") %}
  {% set mat = (" (" ~ cs.material ~ ")") if cs.material else "" %}
  {% set total = cs.purge_total|float %}
  {% set why = (" (+" ~ cfg.purge_to_main_extra|int ~ " back to the main filament)") if cs.to_main|int == 1 else "" %}
  {% set purge_temp = [cs.temp|float, cs.old_temp|float]|max %}
  {% set btns = [cfg.purge_btn1|float, cfg.purge_btn2|float, cfg.purge_btn3|float] %}
  {% set title = "Filament runout" if runout else ("Color swap " ~ (cs.swaps|int + 1)) %}
  {% set ac = cfg.auto_continue_min|float %}
  {% set left = [((ac * 60 - cs.idle_s|float) / 60)|round(0, 'ceil')|int, 0]|max %}
  {% set mat_hold = not runout and cs.material and cs.old_material and cs.material != cs.old_material %}
  {% if ac > 0 and cs.touched|int == 0 and not runout and cs.unloaded|int == 0 %}
    {% set auto_note = (" The material changes (" ~ cs.old_material ~ " to " ~ cs.material ~ "): this swap waits for you.") if mat_hold else (" No action for " ~ left ~ " more min = the print continues with the current color.") %}
  {% else %}
    {% set auto_note = "" %}
  {% endif %}
  {% set cold = " The nozzle has cooled while waiting: the next step reheats it first." if cs.standby|int > 0 else "" %}
  {% set mats = [] %}
  {% for m in ["PLA", "PETG", "ABS", "ASA", "TPU"] %}
    {% if cfg["temp_" ~ m|lower]|float > 0 %}
      {% set _ = mats.append([m, cfg["temp_" ~ m|lower]|int]) %}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if cs.state|int == 0 %}
  {% elif cs.view == "confirm" %}
  # Two steps to continue. "Back" sits where "Continue..." was, so a double tap is harmless.
  RESPOND TYPE=command MSG="action:prompt_begin {title} - continue?"
  {% if cfg.refill_mm|float > 0 %}
  RESPOND TYPE=command MSG="action:prompt_text The nozzle is full again. Cut this strand off at the nozzle with tweezers now (do not yank it), then Yes: the print continues straight away."
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Color clean and the strand cut off at the nozzle? The print continues straight away."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_CS_BACK"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, continue print|_CS_CONTINUE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif cs.view == "keep" %}
  RESPOND TYPE=command MSG="action:prompt_begin {title} - keep the color?"
  RESPOND TYPE=command MSG="action:prompt_text No swap: the print continues straight away with the filament that is in the nozzle now, at {cs.old_temp|int}C.{(' WARNING: the slicer wants ' ~ cs.material ~ ' here, this part will be ' ~ cs.old_material ~ '.') if mat_hold else ''}"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_CS_BACK"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, keep and continue|_CS_KEEP_GO|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif cs.view == "cancel" %}
  RESPOND TYPE=command MSG="action:prompt_begin {title} - cancel?"
  {% if cs.unloaded|int == 1 and cs.state|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_text The old filament is already out of the nozzle, so it is safe to pull by hand. Cancel print turns the heaters off and parks."
  RESPOND TYPE=command MSG="action:prompt_button Cancel print|_CS_CANCEL_PRINT UNLOAD=0|error"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Leave the filament in (do not pull it once cold), or unload it hot now and then cancel."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Cancel print|_CS_CANCEL_PRINT UNLOAD=0|error"
  RESPOND TYPE=command MSG="action:prompt_button Unload hot + cancel|_CS_CANCEL_PRINT UNLOAD=1|error"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back to the swap|_CS_BACK|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif cs.state|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_begin {title} - load {name}"
  # One prompt_text per prompt: KlipperScreen shows only the last one.
  {% if cs.unloaded|int == 0 %}
  RESPOND TYPE=command MSG="action:prompt_text Next: {name}{mat}. The old filament is still in the nozzle: press Unload to change it{'' if runout else ', or Keep current color'}.{auto_note}{cold}"
  {% elif cs.view == "nofil" %}
  RESPOND TYPE=command MSG="action:prompt_text NO FILAMENT at the sensor. Push {name}{mat} in until the extruder grips it, then press Load + purge again."
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Pull the old filament out, insert {name}{mat}, then press Load + purge. Purge {total|round(0)|int} mm{why} at {purge_temp|int}C, print at {cs.temp|int}C. The bed temperature is not changed.{cold}"
  {% endif %}
  {% if not runout %}
  {% for row in mats|batch(3) %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for m in row %}
  RESPOND TYPE=command MSG="action:prompt_button {m[0]} {m[1]}C|_CS_SET_MATERIAL MATERIAL={m[0]}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endfor %}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% if cs.unloaded|int == 0 and not runout %}
  RESPOND TYPE=command MSG="action:prompt_button Keep current color|_CS_KEEP|info"
  {% endif %}
  {% if cs.view == "nofil" %}
  RESPOND TYPE=command MSG="action:prompt_button Load anyway|_CS_LOAD FORCE=1|warning"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Head moved? Re-home|_CS_REHOME|warning"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel...|_CS_CANCEL_MENU|error"
  {% if cs.unloaded|int == 0 %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Unload|_CS_UNLOAD|primary"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Unload again|_CS_UNLOAD"
  RESPOND TYPE=command MSG="action:prompt_footer_button Load + purge|_CS_LOAD|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_begin {title} - check the purge"
  {% if cs.standby|int > 0 %}
  RESPOND TYPE=command MSG="action:prompt_text The nozzle cooled while waiting. Continue... reheats it and purges {cfg.standby_purge_mm|int} mm first, then asks you to cut the strand."
  {% else %}
  {% if cfg.refill_mm|float > 0 %}
  RESPOND TYPE=command MSG="action:prompt_text Color clean? Press Continue...: the nozzle gets {cfg.refill_mm|float|round(1)} mm of fresh plastic and you cut that strand in the next window. Not clean yet? Purge more."
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Color clean? Cut the strand off at the nozzle with tweezers (do not yank it), then Continue. Not clean yet? Purge more."
  {% endif %}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for mm in btns %}
  RESPOND TYPE=command MSG="action:prompt_button Purge +{mm|int}mm|_CS_PURGE_MORE MM={mm}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Head moved? Re-home|_CS_REHOME|warning"
  # Footer layout: the right-hand slot, where "Load + purge" was a moment ago, is a
  # harmless "Purge" - a second tap there purges, it never continues.
  RESPOND TYPE=command MSG="action:prompt_footer_button Continue...|_CS_CONFIRM|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel...|_CS_CANCEL_MENU|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Purge +{btns[1]|int}mm|_CS_PURGE_MORE MM={btns[1]}|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_BUSY]
description: Helper - show a window with no buttons while the printer works, so nothing can be pressed by mistake
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Please wait')}"
  RESPOND TYPE=command MSG="action:prompt_text {params.MSG|default('Working - do not press anything.')}"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CS_CONFIRM]
description: Prompt button - ask once more before the print continues (after a standby: reheat and purge first)
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 2 %}
  _CS_TOUCH
  {% if cs.standby|int > 0 %}
  _CS_WAKE
  {% else %}
  {% set mm = printer["gcode_macro _COLOR_SWAP_CFG"].refill_mm|float %}
  {% if mm > 0 %}
  # v6.6: the nozzle oozed while the purge was checked. Fill it again now, so the
  # strand you cut next is the last thing that leaves it before the print goes on.
  _CS_BUSY TITLE="Color swap - refilling" MSG="Pushing {mm|round(1)} mm of fresh plastic. Then cut that strand. Wait - do not press anything."
  _CS_E MM={cs.hold} F=2100
  _CS_PURGE_PULSES MM={mm}
  _CS_E MM=-{cs.hold} F=2400
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE={cs.purged|float + mm}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"confirm"'
  _CS_SHOW_PROMPT
  {% endif %}
  {% endif %}


[gcode_macro _CS_WAKE]
description: Helper - after a standby: reheat, push the cooked plastic out, then show the purge check again
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set mm = cfg.standby_purge_mm|float %}
  {% if cs.state|int == 2 %}
  _CS_BUSY TITLE="Color swap - reheating" MSG="Heating back to {cs.temp|int}C, then purging {mm|int} mm. Wait - do not press anything."
  _CS_HEAT TEMP={cs.temp}
  {% if mm > 0 %}
  _CS_E MM={cs.hold} F=2100
  _CS_PURGE_PULSES MM={mm}
  _CS_E MM=-{cs.hold} F=2400
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE={cs.purged|float + mm}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=idle_s VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_PURGE_PULSES]
description: Helper - purge MM mm in chunks with a quick pull-back and push between them
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set mm = params.MM|float %}
  {% set flex = cs.material.startswith("TPU") or cs.material.startswith("TPE") or cs.material.startswith("FLEX") %}
  {% set speed = cfg.purge_speed|float * (cfg.flex_speed_pct|float / 100 if flex else 1.0) %}
  {% set step = cfg.purge_pulse_mm|float %}
  {% set back = cfg.purge_pulse_retract|float %}
  {% set n = ((mm / step)|round(0, 'ceil')|int) if step > 0 else 1 %}
  {% set n = [n, 1]|max %}
  {% set chunk = mm / n %}
  {% for i in range(n) %}
  _CS_E MM={chunk|round(4)} F={speed}
  {% if back > 0 and i < n - 1 %}
  G1 E-{back} F2400
  G1 E{back} F2400
  {% endif %}
  {% endfor %}


[gcode_macro _CS_SET_MATERIAL]
description: Prompt button - switch the print temperature to a material preset
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set material = params.MATERIAL|default("PLA")|upper %}
  {% set temp = cfg["temp_" ~ material|lower]|default(0)|float %}
  {% if cs.state|int == 1 and temp >= cfg.min_temp|float %}
  _CS_TOUCH
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=temp VALUE={temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=material VALUE='"{material}"'
  {% if cs.standby|int == 0 %}
  M104 S{[cs.old_temp|float, temp]|max}
  {% endif %}
  RESPOND TYPE=command MSG="Next filament: {material} at {temp|int}C"
  _CS_CALC
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_UNLOAD]
description: Prompt button - pull the old filament out (hot)
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 %}
  _CS_TOUCH
  _CS_BUSY TITLE="Color swap - unloading" MSG="Heating, then pulling the filament out. Wait - do not press anything."
  {% if cs.unloaded|int == 0 %}
  _CS_UNLOAD_STEPS TEMP={cs.old_temp} PRE={cs.hold} RAM=1
  {% else %}
  _CS_UNLOAD_STEPS TEMP={cs.old_temp} RAM=0
  {% endif %}
  M104 S{[cs.old_temp|float, cs.temp|float]|max}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=unloaded VALUE=1
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=hold VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_LOAD]
description: Prompt button - load the new filament and purge it in the air at the right temperature
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set purge = cs.purge_total|float %}
  {% set purge_temp = [cs.temp|float, cs.old_temp|float]|max %}
  {% set cooler = cs.temp|float < purge_temp - 2 %}
  {% set slow = [cfg.load_slow_mm|float, cfg.load_mm|float]|min %}
  {% set flex = cs.material.startswith("TPU") or cs.material.startswith("TPE") or cs.material.startswith("FLEX") %}
  {% set k = (cfg.flex_speed_pct|float / 100) if flex else 1.0 %}
  # A switch sensor keeps reading while it is switched off for the swap.
  {% set so = cs.sensor_obj %}
  {% set empty = cfg.load_check_sensor|int == 1 and so.startswith("filament_switch_sensor ") and so in printer and not printer[so].filament_detected %}
  {% if cs.state|int != 1 or cs.unloaded|int != 1 %}
  {% elif empty and params.FORCE|default(0)|int == 0 %}
  _CS_TOUCH
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"nofil"'
  _CS_SHOW_PROMPT
  {% else %}
  _CS_TOUCH
  # No buttons while it works: a second tap cannot land on anything.
  _CS_BUSY TITLE="Color swap - loading" MSG="Heating to {purge_temp|int}C, loading, then purging {purge|round(0)|int} mm. Wait - do not press anything."
  RESPOND TYPE=command MSG="Heating to {purge_temp|int}C..."
  _CS_HEAT TEMP={purge_temp}
  RESPOND TYPE=command MSG="Loading, then purging {purge|round(0)|int}mm..."
  _CS_E MM={cfg.load_mm|float - slow} F={cfg.load_speed|float * k}
  _CS_E MM={slow} F={cfg.purge_speed|float * k}
  _CS_PURGE_PULSES MM={purge}
  {% if cooler %}
  # Hotter old plastic is out. v6.4: no waiting for the nozzle to cool down (it took
  # 30-40 s): the target drops to the new temperature and the settle push runs at once,
  # while the nozzle cools by itself during the purge check.
  RESPOND TYPE=command MSG="Nozzle set to {cs.temp|int}C for the new filament (no waiting for it to cool)."
  M104 S{cs.temp}
  _CS_E MM={cfg.settle_mm} F={cfg.purge_speed|float * k}
  {% endif %}
  {% set hold = [cs.retract|float, 1.0]|max %}
  G1 E-{hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=hold VALUE={hold}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE={cs.purged|float + purge + (cfg.settle_mm|float if cooler else 0.0)}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=2
  _CS_SHOW_PROMPT
  _CS_ALERT KIND=purge MSG="Purge done: check the color, cut the strand, then Continue"
  {% endif %}


[gcode_macro _CS_PURGE_MORE]
description: Prompt button - purge MM more mm of the new color
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set mm = [[params.MM|default(cfg.purge_btn1)|float, 1.0]|max, 300.0]|min %}
  {% if cs.state|int == 2 %}
  _CS_TOUCH
  _CS_BUSY TITLE="Color swap - purging" MSG="Purging {mm|int} mm. Wait - do not press anything."
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_HEAT TEMP={cs.temp}
  RESPOND TYPE=command MSG="Purging {mm|int}mm..."
  _CS_E MM={cs.hold} F=2100
  _CS_PURGE_PULSES MM={mm}
  _CS_E MM=-{cs.hold} F=2400
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE={cs.purged|float + mm}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_KEEP]
description: Prompt button - ask before continuing with the color that is in the nozzle
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 and cs.unloaded|int == 0 and cs.runout|int == 0 %}
  _CS_TOUCH
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"keep"'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_KEEP_GO]
description: Prompt button / auto continue - no swap: go on printing with the filament that is in the nozzle
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 and cs.unloaded|int == 0 and cs.runout|int == 0 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=temp VALUE={cs.old_temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=material VALUE='"{cs.old_material}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=slot VALUE={cs.cur_slot|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=first VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=2
  _CS_CONTINUE
  {% endif %}


[gcode_macro _CS_CANCEL_MENU]
description: Prompt button - show the cancel choices
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  _CS_TOUCH
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='"cancel"'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_BACK]
description: Prompt button - back from a question to the swap
gcode:
  _CS_TOUCH
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT


[gcode_macro _CS_CANCEL_PRINT]
description: Prompt button - cancel the print safely. UNLOAD=1 pulls the loaded filament out while hot first
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int > 0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if params.UNLOAD|default(0)|int == 1 and (cs.state|int == 2 or cs.unloaded|int == 0) %}
  _CS_UNLOAD_STEPS TEMP={cs.old_temp if cs.state|int == 1 else cs.temp} PRE={cs.hold} RAM=1
  RESPOND MSG="Filament unloaded hot - you can pull it out now."
  {% endif %}
  CANCEL_PRINT
  # Without the hook line in CANCEL_PRINT this still clears the swap.
  _COLOR_SWAP_RESET
  {% endif %}


[gcode_macro _CS_CONTINUE]
description: Prompt button - the swap is done: prime, then RESUME travels back and the print goes on
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 2 and printer.pause_resume.is_paused %}
  _CS_FINISH
  RESUME VELOCITY={cfg.resume_speed}
  {% elif cs.state|int == 1 %}
  # Window closed, error, window again: a KlipperScreen popup that opens on top of a
  # swap window hides it and holds every touch until the window closes (v6.4).
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=error MSG="Color swap: the new filament is not loaded yet."
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _COLOR_SWAP_ON_RESUME]
description: Hook for the first line of RESUME - refuses to resume an unloaded swap, finishes a loaded one
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 %}
  # Klipper renders a whole macro before running it, so the error lives in its own
  # macro. The window comes back half a second AFTER the error: a KlipperScreen popup
  # that opens on top of a swap window hides it and holds every touch (v6.4).
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  RESPOND TYPE=command MSG="action:prompt_end"
  UPDATE_DELAYED_GCODE ID=_CS_REPROMPT DURATION=0.5
  _CS_REFUSE_RESUME
  {% elif cs.state|int == 2 %}
  # RESUME was pressed directly (not the Continue button): do the same work here.
  _CS_FINISH
  {% endif %}


[gcode_macro _CS_FINISH]
description: Helper - reheat, reprime (or the layer-1 wipe line), restore the fan, the sensor and the motors, clear the swap
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 2 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  UPDATE_DELAYED_GCODE ID=_CS_TICK DURATION=0
  _CS_HEAT TEMP={cs.temp}
  # The bed is never changed by a swap; this re-asserts the first filament's bed temperature.
  {% if cs.bed|float > 0 %}
  M140 S{cs.bed}
  {% endif %}
  {% if cs.first|int == 1 and cfg.first_layer_wipe|int == 1 and cs.unloaded|int == 1 %}
  # Layer 1 only: prime with a short line on the bed edge (it falls back to the
  # plain reprime when the line cannot be drawn safely).
  _CS_WIPE_LINE
  {% else %}
  _CS_REPRIME
  {% endif %}
  M106 S{(cs.fan|float * 255)|round|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_slot VALUE={cs.slot|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_material VALUE='"{cs.material}"'
  {% if cs.unloaded|int == 1 and cs.runout|int == 0 %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=swaps VALUE={cs.swaps|int + 1}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wait_total VALUE={cs.wait_total|float + cs.waited|float}
  _COLOR_SWAP_RESET
  {% endif %}


[gcode_macro _CS_REPRIME]
description: Helper - refill the nozzle, retract exactly what RESUME and the slicer will push back, then flick the strand off
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set back = cs.retract|float + cfg.pause_retract_mm|float %}
  M83
  G1 E{(cs.hold|float + cfg.reprime_mm|float)|round(4)} F{cfg.purge_speed}
  {% if back > 0 %}
  G1 E-{back|round(4)} F2400
  {% endif %}
  M400
  {% if cfg.flick|int == 1 %}
  _CS_FLICK
  {% endif %}


[gcode_macro _CS_FLICK]
description: Helper - cool the strand with the part fan and snap it off with short side moves at the park height
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set th = printer.toolhead %}
  {% set d = cfg.flick_mm|float %}
  {% set x, y, z = th.position.x|float, th.position.y|float, th.position.z|float %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  # Delta printers: stay inside print_radius and below the cone (above it only X0 Y0
  # is reachable). Others: inside the axis limits.
  {% set radius = printer.configfile.settings.printer.print_radius|default(0)|float %}
  {% set in_radius = radius <= 0 or ((x|abs + d)**2 + y**2)**0.5 <= radius - 2 %}
  {% set in_box = x - d >= lo.x and x + d <= hi.x %}
  {% set below_cone = z <= th.cone_start_z|default(hi.z)|float %}
  {% if in_radius and in_box and below_cone %}
  M106 S255
  G4 P{cfg.flick_cool_ms|int}
  # Sideways only, relative X moves - Z is not touched.
  G91
  G1 X{d} F18000
  G1 X-{2 * d} F18000
  G1 X{2 * d} F18000
  G1 X-{d} F18000
  G90
  M400
  {% else %}
  RESPOND MSG="Flick skipped: the park point is too close to the edge."
  {% endif %}


[gcode_macro _CS_WIPE_LINE]
description: Helper - layer 1 only - prime with a short line on the bed edge, then lift back to the park height
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set th = printer.toolhead %}
  {% set settings = printer.configfile.settings %}
  {% set delta = settings.printer.kinematics == "delta" %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  {% set inward = cfg.wipe_edge|float + cs.wipe_count|int * cfg.wipe_step|float %}
  {% set margin = cfg.wipe_margin|float %}
  {% set objs = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% set back = cs.retract|float + cfg.pause_retract_mm|float %}
  {% set cone_z = th.cone_start_z|default(hi.z)|float %}
  # Layer 1 only, so the line at wipe_z (0.3) is not lower than the layer itself (0.2).
  {% set wz = cfg.wipe_z|float %}
  {% set ns = namespace(reach=0.0, front=999999.0, pts=0) %}
  {% for o in objs %}
    {% for p in o.polygon|default([]) %}
      {% set ns.pts = ns.pts + 1 %}
      {% set ns.reach = [ns.reach, (p[0]**2 + p[1]**2)**0.5]|max %}
      {% set ns.front = [ns.front, p[1]|float]|min %}
    {% endfor %}
  {% endfor %}
  {% if delta %}
    # Arc from -85 to -45 degrees (0.698 rad) about the bed centre, on the front-right.
    {% set r = -(lo.y|float) - inward %}
    {% set x0, y0 = r * 0.087156, -r * 0.996195 %}
    {% set x1, y1 = r * 0.707107, -r * 0.707107 %}
    {% set length = r * 0.698132 %}
    {% set clear = ns.reach + margin <= r %}
    {% set arcs = "gcode_arcs" in settings %}
  {% else %}
    # Straight line along the front limit, on the right-hand side.
    {% set y0 = lo.y|float + inward %}
    {% set y1 = y0 %}
    {% set x1 = hi.x|float - 10.0 %}
    {% set x0 = x1 - cfg.wipe_len|float %}
    {% set length = cfg.wipe_len|float %}
    {% set clear = ns.front - margin >= y0 %}
    {% set arcs = true %}
  {% endif %}
  {% set inside = [x0, x1]|min >= lo.x and [x0, x1]|max <= hi.x and [y0, y1]|min >= lo.y and [y0, y1]|max <= hi.y %}
  {% if ns.pts == 0 %}
  RESPOND MSG="Wipe line skipped: no object outlines in this G-code (enable Label objects in OrcaSlicer)."
  _CS_REPRIME
  {% elif not clear %}
  RESPOND MSG="Wipe line skipped: a model outline is closer than {margin|int} mm to the line."
  _CS_REPRIME
  {% elif not inside or not arcs %}
  RESPOND MSG="Wipe line skipped: the line leaves the axis limits, or [gcode_arcs] is missing - check wipe_edge and wipe_len."
  _CS_REPRIME
  {% elif th.position.z > cone_z %}
  RESPOND MSG="Wipe line skipped: parked above the delta cone."
  _CS_REPRIME
  {% else %}
  {% set e = length * cfg.wipe_e_per_mm|float %}
  {% set z_back = th.position.z %}
  RESPOND MSG="Layer 1 wipe line on the bed edge..."
  M83
  G1 E{(cs.hold|float + cfg.reprime_mm|float)|round(4)} F{cfg.purge_speed}
  # Sideways at the park height (above the model), down at the bed edge, line, up again.
  G90
  G1 X{x0|round(3)} Y{y0|round(3)} F6000
  G1 Z{wz} F1500
  {% if delta %}
  G3 X{x1|round(3)} Y{y1|round(3)} I{(-x0)|round(3)} J{(-y0)|round(3)} E{e|round(4)} F{cfg.wipe_speed}
  {% else %}
  G1 X{x1|round(3)} Y{y1|round(3)} E{e|round(4)} F{cfg.wipe_speed}
  {% endif %}
  # Retract exactly what RESUME and the slicer push back after the swap.
  {% if back > 0 %}
  G1 E-{back|round(4)} F2400
  {% endif %}
  G1 Z{z_back} F1500
  M400
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE={cs.wipe_count|int + 1}
  {% endif %}


[gcode_macro _CS_REFUSE_RESUME]
description: Helper - stop RESUME while the new filament is not loaded
gcode:
  {action_raise_error("Color swap: the new filament is not loaded yet - press Load + purge first (or Keep current color).")}


[delayed_gcode _CS_REPROMPT]
# Shows the swap window again after an error message, so the window is the newest
# thing on the printer screen and takes the touches.
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _COLOR_SWAP_RESET]
description: Hook for CANCEL_PRINT - clear the swap state, turn the runout sensor back on, release the motors
gcode:
  {% set idle = (printer.configfile.settings.idle_timeout|default({})).timeout|default(600)|float %}
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=state VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=view VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=runout VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=0
  UPDATE_DELAYED_GCODE ID=_CS_TICK DURATION=0
  SET_IDLE_TIMEOUT TIMEOUT={idle|int}
  {% endif %}
  _CS_SENSOR ENABLE=1
  _CS_HOLD ON=0


[gcode_macro _CS_SENSOR]
description: Helper - switch the runout sensor found by _CS_DETECT on or off, if the printer has one
gcode:
  {% set so = printer["gcode_macro COLOR_SWAP"].sensor_obj %}
  {% if so and so in printer %}
  SET_FILAMENT_SENSOR SENSOR={so.split(" ", 1)[1]} ENABLE={params.ENABLE|default(1)|int}
  {% endif %}


[gcode_macro _CS_HOLD]
description: Helper - ON=1 holds the head motors at run current (head locked), ON=0 restores hold_current
gcode:
  # Pushing filament into a direct-drive extruder pushes the head. At hold_current
  # the motors can slip and the printer loses its position.
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set on = params.ON|default(1)|int == 1 %}
  {% set settings = printer.configfile.settings %}
  {% set want = cfg.hold_steppers %}
  {% if cfg.hold_boost|int == 1 %}
  {% for key in settings %}
  {% if key.startswith("tmc") and " " in key %}
  {% set st = key.split(" ", 1)[1] %}
  {% set picked = (st in want) if want|length > 0 else st.startswith("stepper_") %}
  {% if picked and "hold_current" in settings[key] and "run_current" in settings[key] %}
  SET_TMC_CURRENT STEPPER={st} HOLDCURRENT={settings[key].run_current if on else settings[key].hold_current}
  {% endif %}
  {% endif %}
  {% endfor %}
  {% endif %}


[gcode_macro _CS_REHOME]
description: Prompt button - the head was pushed and lost its place: home (straight up on a delta) and go back to the park point
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int > 0 and printer.pause_resume.is_paused %}
  _CS_TOUCH
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.configfile.settings.printer.kinematics == "delta" %}
  # Delta endstops are at the top: homing only moves the head up, away from the part.
  RESPOND TYPE=command MSG="Re-homing: the head goes straight UP to the top, then back to the park point..."
  G28
  {% else %}
  # On most other printers homing Z moves DOWN onto the part: home X and Y only,
  # at the park height, which is above the model.
  RESPOND TYPE=command MSG="Re-homing X and Y at the park height..."
  G28 X Y
  {% endif %}
  _CS_GO_PARK Z={cs.z_floor}
  RESPOND TYPE=command MSG="Position restored. Continue print goes back to the exact point the print paused at."
  _CS_SHOW_PROMPT
  {% endif %}


[gcode_macro _CS_GO_PARK]
description: Helper - right after homing, go to the park point above a model whose top is at Z. Not for direct use.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set th = printer.toolhead %}
  {% set zf = params.Z|float %}
  {% set max_z = th.axis_maximum.z|float %}
  {% set cone = th.cone_start_z|default(max_z)|float %}
  # Same height rule as the pause: park_lift above the model, at least park_min_z.
  {% set park_z = [[[zf + cfg.park_lift|float, cfg.park_min_z|float]|max, max_z - 10.0]|min, zf]|max %}
  G90
  {% if printer.configfile.settings.printer.kinematics == "delta" %}
  # Delta home is the top centre: come straight down the centre to the park
  # height (above the model), then out to the park point.
  G1 X0 Y0 Z{park_z|round(3)} F3000
  {% if park_z <= cone %}
  G1 X{cs.px} Y{cs.py} F6000
  {% endif %}
  {% else %}
  # Height first (it is above the model), then sideways.
  G1 Z{park_z|round(3)} F1500
  G1 X{cs.px} Y{cs.py} F6000
  {% endif %}
  M400


# ---------------------------------------------------------------------------
# Version 6: the waiting clock - standby, heater off, reminders, auto continue
# ---------------------------------------------------------------------------

[delayed_gcode _CS_TICK]
# Runs every 10 s while a swap waits. It only runs between two commands, never in
# the middle of a load or a purge.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set waited = cs.waited|float + 10 %}
  {% set idle = cs.idle_s|float + 10 %}
  {% set ac = cfg.auto_continue_min|float * 60 %}
  {% set sb = cfg.standby_min|float * 60 %}
  {% set off = cfg.nozzle_off_min|float * 60 %}
  {% set rem = cfg.remind_min|float * 60 %}
  {% if cs.state|int == 0 %}
  {% elif not printer.pause_resume.is_paused %}
  # The print was cancelled or resumed by something that has no hook line.
  _COLOR_SWAP_RESET
  {% else %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=waited VALUE={waited}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=idle_s VALUE={idle}
  UPDATE_DELAYED_GCODE ID=_CS_TICK DURATION=10
  # AWAY and nobody touched the swap: the print goes on by itself soon, so the nozzle
  # stays hot for it (a cooled nozzle would resume with cooked plastic and no one to cut it).
  # Never when the material type changes (v6.5): that swap waits for a person.
  {% set mat_hold = cs.material and cs.old_material and cs.material != cs.old_material %}
  {% set armed = ac > 0 and cs.state|int == 1 and cs.unloaded|int == 0 and cs.touched|int == 0 and cs.runout|int == 0 and not mat_hold %}
  {% if armed and idle >= ac %}
  RESPOND TYPE=command MSG="No swap for {cfg.auto_continue_min|int} min: the print continues with the current color."
  _CS_ALERT KIND=auto MSG="No swap for {cfg.auto_continue_min|int} min: the print continues with the current color" BEEP=0
  _CS_KEEP_GO
  {% elif not armed and cs.standby|int == 0 and sb > 0 and idle >= sb and printer.extruder.target|float > cfg.standby_temp|float %}
  RESPOND TYPE=command MSG="Waiting {(idle / 60)|int} min: nozzle cooled to {cfg.standby_temp|int}C. The next button reheats it."
  M104 S{cfg.standby_temp}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=1
  {% elif not armed and cs.standby|int < 2 and off > 0 and idle >= off and printer.extruder.target|float > 0 %}
  M104 S0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=standby VALUE=2
  _CS_ALERT KIND=off MSG="Color swap waiting {(waited / 60)|int} min: nozzle heater switched off. The bed and the motors stay on - the print can still continue"
  {% elif rem > 0 and (waited % rem) < 10 %}
  _CS_ALERT KIND=remind MSG="Color swap still waiting ({(waited / 60)|int} min) - {('the old filament is still in: press Unload' ~ (' (material changes ' ~ cs.old_material ~ ' to ' ~ cs.material ~ ')' if mat_hold and cs.runout|int == 0 else '')) if cs.state|int == 1 and cs.unloaded|int == 0 else ('insert the filament' if cs.state|int == 1 else 'check the purge and Continue')}"
  {% endif %}
  {% endif %}


# ---------------------------------------------------------------------------
# Resume points and RESUME_SAVED_PRINT
# ---------------------------------------------------------------------------

[gcode_macro _CS_CHECKPOINT]
description: Helper - save a resume point for RESUME_SAVED_PRINT (layer start from the slicer, KIND=swap, KIND=auto, KIND=stop TO=cs_stop)
gcode:
  # One SAVE_VARIABLE: the file position of this line plus everything needed to
  # continue from it (position, temperatures, fan, offsets, mesh, main filament...).
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set ps = printer.print_stats %}
  {% set g = printer.gcode_move %}
  {% set kind = params.KIND|default("layer")|lower %}
  {% set swap = kind == "swap" %}
  {% set info = ps.info|default({}) %}
  {% set layer = params.LAYER|default(info.current_layer|default(0, true))|int %}
  {% set total = params.TOTAL|default(info.total_layer|default(0, true))|int %}
  {% set file = ps.filename|default("") %}
  {% set bad = not file or "/" in file or "'" in file or '"' in file or "\\" in file %}
  {% if not swap and params.LAYER is defined and total > 0 %}
  SET_PRINT_STATS_INFO TOTAL_LAYER={total} CURRENT_LAYER={layer}
  {% endif %}
  {% if "save_variables" not in printer %}
  {% elif bad %}
  {% if swap or layer <= 1 %}
  RESPOND TYPE=command MSG="Resume points are not saved for this file: it must be in the main folder, with no quotes or backslashes in its name."
  {% endif %}
  {% elif swap and cs.state|int == 0 %}
  {% elif swap and ps.state != "paused" %}
  # The file has not stopped after the COLOR_SWAP line yet: try again in a second.
  UPDATE_DELAYED_GCODE ID=_CS_SWAP_CHECKPOINT DURATION=1
  {% elif not swap and ps.state != "printing" %}
  {% else %}
  {% set slot = cs.slot|int if swap else params.SLOT|default(cs.cur_slot)|int %}
  {% set mat = cs.material if swap else params.MATERIAL|default(cs.cur_material)|upper %}
  {% set cp = {
    "kind": kind if kind in ["swap", "auto", "stop"] else "layer",
    "file": file,
    "pos": printer.virtual_sdcard.file_position|int,
    "layer": layer,
    "total": total,
    "x": ((cs.sx if swap else g.gcode_position.x)|float)|round(3),
    "y": ((cs.sy if swap else g.gcode_position.y)|float)|round(3),
    "z": ((cs.sz if swap else g.gcode_position.z)|float)|round(3),
    "e": ((cs.se if swap else g.gcode_position.e)|float)|round(4),
    "abse": (cs.sabse if swap else (1 if g.absolute_extrude else 0))|int,
    "temp": ((cs.temp if swap else printer.extruder.target)|float)|round(1),
    "ptemp": (([cs.temp|float, cs.old_temp|float]|max if swap else printer.extruder.target)|float)|round(1),
    "bed": ((cs.bed if swap else (printer.heater_bed.target if "heater_bed" in printer else 0))|float)|round(1),
    "fan": ((cs.fan if swap else (printer.fan.speed if "fan" in printer else 0))|float)|round(3),
    "retract": ((cs.retract if swap else 0)|float)|round(3),
    "slot": slot,
    "mat": mat,
    "main": cs.main_material,
    "wc": cs.wipe_count|int,
    "sw": cs.swaps|int,
    "pg": (cs.purged|float)|round(1),
    "offz": (g.homing_origin.z|float)|round(4),
    "sf": (g.speed_factor|float)|round(3),
    "ef": (g.extrude_factor|float)|round(3),
    "pa": (printer.extruder.pressure_advance|float)|round(4),
    "st": (printer.extruder.smooth_time|float)|round(4),
    "mesh": printer.bed_mesh.profile_name if "bed_mesh" in printer else "",
    "excl": printer.exclude_object.excluded_objects if "exclude_object" in printer else []
  } %}
  SAVE_VARIABLE VARIABLE={"cs_stop" if params.TO|default("")|lower == "cs_stop" else "cs_resume"} VALUE="{cp}"
  {% if swap %}
  RESPOND TYPE=command MSG="Resume point saved at this color swap (RESUME_SAVED_PRINT)."
  {% endif %}
  {% endif %}


[gcode_macro _CS_STOP_POINT]
description: Hook for the FIRST line of CANCEL_PRINT - remember where the print really stopped (before the heaters go off)
gcode:
  # The last save point can be up to a minute (or a whole swap) behind the place the
  # print was cancelled at; continuing from it prints those lines twice. This keeps the
  # exact stop as a second choice for RESUME_SAVED_PRINT (v6.4). Only while the file
  # runs: a paused print is parked away from the part, and a swap has its own point.
  {% set ps = printer.print_stats %}
  {% if "save_variables" in printer and ps.state == "printing" and not printer.pause_resume.is_paused
        and printer.virtual_sdcard.is_active and printer["gcode_macro COLOR_SWAP"].state|int == 0 %}
  _CS_CHECKPOINT KIND=stop TO=cs_stop
  {% endif %}


[delayed_gcode _CS_SWAP_CHECKPOINT]
gcode:
  # Runs 1 s after COLOR_SWAP: by then the file has stopped after the COLOR_SWAP
  # line, so the saved position continues right after the swap.
  _CS_CHECKPOINT KIND=swap


[delayed_gcode _CS_AUTOSAVE]
# Power-loss save, independent of the slicer: every autosave_s seconds while a
# print runs. It only runs between two G-code lines, so the saved file position and
# the saved nozzle position always belong together.
# It also notices a new print and a finished print on printers whose START_PRINT
# and END_PRINT do not have the _CS_CLEAR_CHECKPOINT lines.
initial_duration: 30
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set ps = printer.print_stats %}
  {% set fname = ps.filename|default("")|replace('"', '')|replace("'", '') %}
  {% set dur = ps.print_duration|default(0)|float %}
  {% set every = cfg.autosave_s|int %}
  {% if ps.state == "printing" and (fname != cs.job_file or dur + 1 < cs.job_dur|float) %}
  _CS_NEW_JOB
  {% elif ps.state == "printing" %}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_dur VALUE={dur}
  {% elif ps.state == "complete" and cs.done|int == 0 and cs.job_file %}
  _CS_CLEAR_CHECKPOINT DONE=1
  {% endif %}
  {% if every > 0 and ps.state == "printing" and printer.virtual_sdcard.is_active and cs.state|int == 0 and cs.done|int == 0 %}
  _CS_CHECKPOINT KIND=auto
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_CS_AUTOSAVE DURATION={every if every > 0 else 60}


[delayed_gcode _CS_BOOT]
# At start: load the settings changed on the screen, then work out the park point
# and find the sensor.
initial_duration: 2
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set ov = printer.save_variables.variables.cs_set|default(0) if "save_variables" in printer else 0 %}
  {% if ov is mapping %}
  {% for k, v in ov.items() %}
  {% if k in cfg and v is number %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE={k} VALUE={v}
  {% endif %}
  {% endfor %}
  {% endif %}
  # AWAY waits the away time that the settings window shows (a saved away time with
  # the factory AWAY mode would otherwise wait a different time than it says).
  {% set om = ov if ov is mapping else {} %}
  {% set ac = om.auto_continue_min|default(cfg.auto_continue_min)|float %}
  {% set am = [om.away_min|default(cfg.away_min)|float, 1]|max %}
  {% if ac > 0 and ac != am %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE=auto_continue_min VALUE={am|int if am == am|int else am}
  {% endif %}
  _CS_DETECT


[delayed_gcode _CS_BOOT_CHECK]
# After a power cut: when the printer starts and an unfinished print is saved,
# open the resume window by itself (late enough for KlipperScreen to be running).
initial_duration: 60
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  {% if cfg.boot_prompt|int == 1 and cp is mapping and printer.print_stats.state not in ["printing", "paused"] %}
  RESPOND MSG="An unfinished print is saved ({cp.file}). Resume it with RESUME_SAVED_PRINT, or delete the point."
  RESUME_SAVED_PRINT
  _CS_ALERT KIND=saved MSG="Printer started with an unfinished print saved ({cp.file}) - open Resume saved"
  {% endif %}


[gcode_macro _CS_CLEAR_CHECKPOINT]
description: Hook - forget the resume point (first line of START_PRINT. Last line of END_PRINT with DONE=1)
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set ps = printer.print_stats %}
  {% set fname = ps.filename|default("")|replace('"', '')|replace("'", '') %}
  {% set done = params.DONE|default(0)|int == 1 %}
  {% if "save_variables" in printer and printer.save_variables.variables.cs_resume|default(0) is mapping %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE=0
  {% endif %}
  {% if "save_variables" in printer and printer.save_variables.variables.cs_stop|default(0) is mapping %}
  SAVE_VARIABLE VARIABLE=cs_stop VALUE=0
  {% endif %}
  {% if done and (cs.swaps|int > 0 or cs.purged|float > 0) %}
  RESPOND MSG="Color swaps in this print: {cs.swaps|int}, purged {cs.purged|float|round(0)|int} mm of filament (about {(cs.purged|float * 2.405)|round(0)|int} mm3), waited {(cs.wait_total|float / 60)|round(0)|int} min."
  {% endif %}
  # A new print starts (or one ends): forget its main filament, lines and counters.
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='""'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=swaps VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wait_total VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_file VALUE='"{fname}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_dur VALUE={ps.print_duration|default(0)|float}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=done VALUE={1 if done else 0}


[gcode_macro _CS_PROMPT_CLOSE]
description: Prompt button - close the window
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro RESUME_SAVED_PRINT]
description: Continue a stopped print (cancelled at a color swap, head moved, power cut) from its last saved point
# step: 0 not started, 1 homed and hot at the park point, waiting for load / purge
variable_step: 0
# loaded: 0 after Unload until Load + purge. hold: mm the filament is retracted.
variable_loaded: 1
variable_hold: 0
# confirm: 1 while the "continue?" question is shown
variable_confirm: 0
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
  RESPOND TYPE=error MSG="A print is running or paused - RESUME_SAVED_PRINT is for a print that has stopped."
  {% else %}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_CONFIRM]
description: Resume button - ask once more before the file continues (ON=0 goes back)
gcode:
  {% if printer["gcode_macro RESUME_SAVED_PRINT"].step|int == 1 %}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE={params.ON|default(1)|int}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_SHOW]
description: Helper - show the RESUME_SAVED_PRINT window for the current step
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  {% set btns = [cfg.purge_btn1|float, cfg.purge_btn2|float, cfg.purge_btn3|float] %}
  {% set delta = printer.configfile.settings.printer.kinematics == "delta" %}
  {% if cp is not mapping and "save_variables" in printer and printer.save_variables.variables.cs_stop|default(0) is mapping %}
  {% set cp = printer.save_variables.variables.cs_stop %}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if cp is not mapping %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume saved print"
  RESPOND TYPE=command MSG="action:prompt_text No saved point. One is saved every minute while printing, at every color swap, and at every layer start (Orca _CS_CHECKPOINT line)."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_PROMPT_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif rs.step|int == 1 and rs.confirm|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume - continue?"
  RESPOND TYPE=command MSG="action:prompt_text Right filament in, purge clean, strand cut off? The head goes above the part to the saved point and the print continues."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_CS_RS_CONFIRM ON=0"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, continue print|_CS_RS_GO|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif rs.step|int == 0 %}
  {% set sp = printer.save_variables.variables.cs_stop|default(0) %}
  {% set later = sp is mapping and sp.file == cp.file and sp.pos|int > cp.pos|int %}
  {% if cp.kind == "swap" %}
  {% set where = "color swap to filament " ~ cp.slot %}
  {% elif cp.kind == "stop" %}
  {% set where = "where it was cancelled, layer " ~ cp.layer %}
  {% elif cp.kind == "auto" %}
  {% set where = "during layer " ~ cp.layer if cp.layer|int > 0 else "mid-print" %}
  {% else %}
  {% set where = "start of layer " ~ cp.layer %}
  {% endif %}
  {% set of = (" of " ~ cp.total) if cp.total|int > 0 else "" %}
  {% set how = "homes (the head goes UP)" if delta else "keeps the position it still has (or homes X and Y only)" %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume saved print"
  {% if later %}
  {% set ahead = ((sp.pos|int - cp.pos|int) / 1024)|round(0)|int %}
  RESPOND TYPE=command MSG="action:prompt_text {cp.file} - saved at the {where}{of}, Z {cp.z|round(2)}. The print went on about {ahead} kB of G-code after it, then was cancelled at layer {sp.layer} with {sp.mat or 'the filament'} at {sp.temp|int}C: from the save point those lines are printed twice. Only if the part is still stuck to the bed. Start heats the bed, {how}, parks and heats the nozzle."
  RESPOND TYPE=command MSG="action:prompt_button From where it stopped (no double lines)|_CS_RS_USE_STOP|primary"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text {cp.file} - {where}{of}, Z {cp.z|round(2)}. Only if the part is still stuck to the bed and nothing touches the nozzle. Start heats the bed, {how}, parks and heats the nozzle."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Delete point|_CS_RS_CLEAR|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_PROMPT_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_footer_button {'Start from the save point' if later else 'Start'}|_CS_RS_PREP|{'secondary' if later else 'primary'}"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  {% set mat = (" (" ~ cp.mat ~ ")") if cp.mat else "" %}
  {% set name = ("filament " ~ cp.slot) if cp.slot|int > 0 else "the filament" %}
  RESPOND TYPE=command MSG="action:prompt_begin Resume - {name}{mat}"
  {% if rs.loaded|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_text {name|capitalize}{mat} must be in the nozzle. Already in: Purge until it runs clean. Wrong or none: Unload, insert it, Load + purge. Cut the strand at the nozzle, then Continue print."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for mm in btns %}
  RESPOND TYPE=command MSG="action:prompt_button Purge +{mm|int}mm|_CS_RS_PURGE MM={mm}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text The filament is out. Insert {name}{mat}, then Load + purge."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Unload|_CS_RS_UNLOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Load + purge|_CS_RS_LOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Cancel resume|_CS_RS_CANCEL|error"
  # Same safe layout as the swap: "Continue..." on the left opens a question; the
  # right-hand slot (where "Start" was) only purges.
  RESPOND TYPE=command MSG="action:prompt_footer_button Continue...|_CS_RS_CONFIRM|primary"
  {% if rs.loaded|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Purge +{btns[1]|int}mm|_CS_RS_PURGE MM={btns[1]}|secondary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_RS_USE_STOP]
description: Resume button - continue from where the print was cancelled instead of the last save point
gcode:
  {% set sp = printer.save_variables.variables.cs_stop|default(0) if "save_variables" in printer else 0 %}
  {% if sp is mapping and printer["gcode_macro RESUME_SAVED_PRINT"].step|int == 0 %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE="{sp}"
  SAVE_VARIABLE VARIABLE=cs_stop VALUE=0
  RESPOND TYPE=command MSG="Resume point set to where the print was cancelled (layer {sp.layer}, Z {sp.z})."
  {% endif %}
  _CS_RS_SHOW


[gcode_macro _CS_RS_PREP]
description: Resume button - heat, home (straight up on a delta), restore the Z offset and mesh, park and heat the nozzle
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cp = printer.save_variables.variables.cs_resume|default(0) if "save_variables" in printer else 0 %}
  {% set sp = printer.save_variables.variables.cs_stop|default(0) if "save_variables" in printer else 0 %}
  {% if cp is not mapping and sp is mapping %}
  {% set cp = sp %}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set settings = printer.configfile.settings %}
  {% set max_z = th.axis_maximum.z|float %}
  {% set delta = settings.printer.kinematics == "delta" %}
  {% set cone = th.cone_start_z|default(max_z)|float %}
  {% set homed = "x" in th.homed_axes and "y" in th.homed_axes and "z" in th.homed_axes %}
  # Klipper always lists force_move, so look at the switch itself.
  {% set trust = cfg.resume_trust_z|int == 1 and (settings.force_move|default({})).enable_force_move|default(false) %}
  {% if cp is not mapping %}
  RESPOND TYPE=error MSG="No saved point to resume."
  _CS_RS_SHOW
  {% elif printer.print_stats.state in ["printing", "paused"] %}
  RESPOND TYPE=error MSG="A print is running."
  _CS_RS_SHOW
  {% elif not delta and not homed and not trust %}
  RESPOND TYPE=error MSG="The motors were switched off, and on this printer homing Z would come down onto the part. It can only be resumed with resume_trust_z on (Settings > Power loss resume) and [force_move] enable_force_move: True - and only if the bed did not move."
  _CS_RS_SHOW
  {% elif delta and [cp.z|float + cfg.park_lift|float, cfg.park_min_z|float]|max > cone - 1 %}
  RESPOND TYPE=error MSG="The saved point (Z {cp.z|round(1)}) is too high to park beside the part - it cannot be resumed."
  _CS_RS_SHOW
  {% elif cp.temp|float < cfg.min_temp|float %}
  RESPOND TYPE=error MSG="The saved nozzle temperature ({cp.temp|int}C) is too low to print."
  _CS_RS_SHOW
  {% else %}
  # Heat to the print temperature of the filament that should be in the nozzle.
  # Unload and Load + purge go hotter themselves when the old filament needs it.
  {% set ptemp = cp.temp|float %}
  _CS_BUSY TITLE="Resume - preparing" MSG="Heating the bed, finding the position, parking, heating the nozzle. Several minutes - do not press anything."
  {% if sp is mapping and printer.save_variables.variables.cs_resume|default(0) is not mapping %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE="{sp}"
  {% endif %}
  # Fails here, before anything moves, if the file is gone.
  M23 {cp.file}
  _CS_DETECT
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=z_floor VALUE={cp.z}
  SET_IDLE_TIMEOUT TIMEOUT=3600
  {% if cp.bed|float > 0 %}
  M140 S{cp.bed}
  {% endif %}
  M104 S{ptemp}
  {% if delta %}
  RESPOND TYPE=command MSG="Homing: the head goes straight UP to the top..."
  G28
  {% elif homed %}
  RESPOND TYPE=command MSG="The printer still knows its position: no homing."
  {% else %}
  # Z is taken as still being where the print stopped. Lift first, then home X and Y.
  RESPOND TYPE=command MSG="Trusting Z, lifting, then homing X and Y only..."
  SET_KINEMATIC_POSITION Z={(cp.z|float + cp.offz|float)|round(3)}
  G91
  G1 Z{cfg.park_lift} F600
  G90
  G28 X Y
  {% endif %}
  SET_GCODE_OFFSET Z={cp.offz}
  {% if "bed_mesh" in printer %}
  {% set bm = printer.bed_mesh %}
  {% if not cp.mesh %}
  BED_MESH_CLEAR
  {% elif bm.profile_name == cp.mesh %}
  {% elif cp.mesh in bm.profiles %}
  BED_MESH_PROFILE LOAD={cp.mesh}
  {% elif "default" in bm.profiles %}
  RESPOND TYPE=command MSG="Mesh {cp.mesh} is gone (an adaptive mesh is lost at restart) - using default. Above the mesh fade height it makes no difference."
  BED_MESH_PROFILE LOAD=default
  {% endif %}
  {% endif %}
  _CS_GO_PARK Z={cp.z}
  _CS_HOLD ON=1
  {% if cp.bed|float > 0 %}
  RESPOND TYPE=command MSG="Heating the bed to {cp.bed|int}C..."
  M190 S{cp.bed}
  {% endif %}
  RESPOND TYPE=command MSG="Heating the nozzle to {ptemp|int}C..."
  _CS_HEAT TEMP={ptemp}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE=0
  _CS_RS_SHOW
  _CS_ALERT KIND=resume MSG="Resume ready: printer hot and parked - purge, cut the strand, then Continue"
  {% endif %}


[gcode_macro _CS_RS_PURGE]
description: Resume button - purge MM mm of the filament that is in the nozzle
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set mm = [[params.MM|default(cfg.purge_btn1)|float, 1.0]|max, 300.0]|min %}
  {% set hold = [cp.retract|float, 1.0]|max %}
  {% if rs.step|int == 1 and rs.loaded|int == 1 %}
  _CS_BUSY TITLE="Resume - purging" MSG="Purging {mm|int} mm. Wait - do not press anything."
  _CS_HEAT TEMP={cp.temp}
  RESPOND TYPE=command MSG="Purging {mm|int}mm..."
  M83
  {% if rs.hold|float > 0 %}
  G1 E{rs.hold} F2100
  {% endif %}
  _CS_PURGE_PULSES MM={mm}
  G1 E-{hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE={hold}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_UNLOAD]
description: Resume button - pull the filament out (hot)
gcode:
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set ptemp = [cp.temp|float, cp.ptemp|default(0)|float]|max %}
  {% if rs.step|int == 1 %}
  _CS_BUSY TITLE="Resume - unloading" MSG="Heating, then pulling the filament out. Wait - do not press anything."
  _CS_UNLOAD_STEPS TEMP={ptemp} PRE={rs.hold} RAM=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE=0
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_LOAD]
description: Resume button - load the filament slowly and purge it
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set ptemp = [cp.temp|float, cp.ptemp|default(0)|float]|max %}
  {% set hold = [cp.retract|float, 1.0]|max %}
  {% if rs.step|int == 1 %}
  _CS_BUSY TITLE="Resume - loading" MSG="Heating, loading slowly, then purging. Wait - do not press anything."
  _CS_HEAT TEMP={ptemp}
  RESPOND TYPE=command MSG="Loading slowly, then purging {cfg.purge_default|int}mm..."
  # All at purge speed: safe even if the filament was already in the nozzle.
  _CS_E MM={cfg.load_mm} F={cfg.purge_speed}
  _CS_PURGE_PULSES MM={cfg.purge_default}
  {% if cp.temp|float < ptemp - 2 %}
  M106 S255
  _CS_HEAT TEMP={cp.temp}
  M106 S0
  _CS_E MM={cfg.settle_mm} F={cfg.purge_speed}
  {% endif %}
  G1 E-{hold} F2400
  M400
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=loaded VALUE=1
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=hold VALUE={hold}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro _CS_RS_GO]
description: Resume button - reprime, flick, travel above the saved point and continue the file from it
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set rs = printer["gcode_macro RESUME_SAVED_PRINT"] %}
  {% set cp = printer.save_variables.variables.cs_resume %}
  {% set idle = (printer.configfile.settings.idle_timeout|default({})).timeout|default(600)|float %}
  # A swap point already includes the slicer's Z-hop; a layer point is the top of
  # the last finished layer, so stop resume_lift above it.
  # An "auto" point (power-loss save) is mid-layer: the next lines print without
  # setting Z, so the nozzle must be at exactly the saved height (where it was).
  {% set lift = cfg.resume_lift|float if cp.kind == "layer" else 0.0 %}
  {% set total = cp.total|default(0)|int %}
  {% set fname = cp.file|replace('"', '')|replace("'", '') %}
  {% if rs.step|int != 1 %}
  {% elif rs.loaded|int == 0 %}
  RESPOND TYPE=error MSG="The filament is out - insert it and press Load + purge first."
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  _CS_RS_SHOW
  {% else %}
  _CS_BUSY TITLE="Resume - continuing" MSG="Priming, then moving above the part to the saved point. The print continues by itself."
  _CS_HEAT TEMP={cp.temp}
  M83
  G1 E{rs.hold|float + cfg.reprime_mm|float} F{cfg.purge_speed}
  {% if cp.retract|float > 0 %}
  # A swap point continues with the slicer pushing RETRACT back in.
  G1 E-{cp.retract} F2400
  {% endif %}
  M400
  {% if cfg.flick|int == 1 %}
  _CS_FLICK
  {% endif %}
  M106 S{(cp.fan|float * 255)|round|int}
  # Sideways at the park height (above the model), then straight down to the point.
  G90
  G1 X{cp.x} Y{cp.y} F{cfg.resume_speed|float * 60}
  G1 Z{cp.z|float + lift} F1200
  {% if cp.abse|int == 1 %}
  M82
  G92 E{cp.e}
  {% else %}
  M83
  {% endif %}
  M220 S{(cp.sf|float * 100)|round(1)}
  M221 S{(cp.ef|float * 100)|round(1)}
  SET_PRESSURE_ADVANCE ADVANCE={cp.pa} SMOOTH_TIME={cp.st}
  _CS_HOLD ON=0
  SET_IDLE_TIMEOUT TIMEOUT={idle|int}
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=confirm VALUE=0
  # Give the print back what a restart wiped: its main filament, the filament in the
  # nozzle, the layer-1 lines already drawn and the statistics.
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=done VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_file VALUE='"{fname}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=job_dur VALUE=0
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=main_material VALUE='"{cp.main|default("")}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_material VALUE='"{cp.mat|default("")}"'
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=cur_slot VALUE={cp.slot|default(0)|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=wipe_count VALUE={cp.wc|default(0)|int}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=swaps VALUE={cp.sw|default(0)|int + (1 if cp.kind == "swap" else 0)}
  SET_GCODE_VARIABLE MACRO=COLOR_SWAP VARIABLE=purged VALUE={cp.pg|default(0)|float}
  {% if printer.save_variables.variables.cs_stop|default(0) is mapping %}
  SAVE_VARIABLE VARIABLE=cs_stop VALUE=0
  {% endif %}
  RESPOND TYPE=command MSG="Continuing {cp.file} from the saved point..."
  RESPOND TYPE=command MSG="action:prompt_end"
  # M23 resets the job (and the excluded objects), so they are restored after it.
  M23 {cp.file}
  {% for name in cp.excl %}
  EXCLUDE_OBJECT NAME={name}
  {% endfor %}
  {% if total > 0 %}
  SET_PRINT_STATS_INFO TOTAL_LAYER={total} CURRENT_LAYER={cp.layer|int}
  {% endif %}
  M26 S{cp.pos|int}
  M24
  {% endif %}


[gcode_macro _CS_RS_CANCEL]
description: Resume button - stop: heaters off, park at the top, keep the saved point
gcode:
  {% set idle = (printer.configfile.settings.idle_timeout|default({})).timeout|default(600)|float %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=RESUME_SAVED_PRINT VARIABLE=step VALUE=0
  M104 S0
  M140 S0
  M106 S0
  _CS_HOLD ON=0
  SDCARD_RESET_FILE
  SET_IDLE_TIMEOUT TIMEOUT={idle|int}
  {% if "gcode_macro _SAFE_PARK" in printer %}
  _SAFE_PARK
  {% endif %}
  RESPOND TYPE=command MSG="Resume cancelled. The saved point is kept (RESUME_SAVED_PRINT)."


[gcode_macro _CS_RS_CLEAR]
description: Resume button - delete the saved point
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "save_variables" in printer %}
  SAVE_VARIABLE VARIABLE=cs_resume VALUE=0
  SAVE_VARIABLE VARIABLE=cs_stop VALUE=0
  {% endif %}
  RESPOND TYPE=command MSG="Saved point deleted."


# ---------------------------------------------------------------------------
# Version 6: the settings window (KlipperScreen > Color swap settings, or Mainsail)
# ---------------------------------------------------------------------------

[gcode_macro COLOR_SWAP_SETTINGS]
description: Open the color swap settings window: the everyday choices first, then Advanced and Printer setup
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set groups = printer["gcode_macro _CS_SCHEMA"].groups %}
  {% set sec = printer.configfile.settings["gcode_macro _color_swap_cfg"]|default({}) %}
  {% set delta = printer.configfile.settings.printer.kinematics == "delta" %}
  {% set g = params.G|default(-1)|int %}
  {% set view = params.V|default("main")|lower %}
  {% set per = 6 %}
  {% set away = cfg.auto_continue_min|float > 0 %}
  # A swap that already needs hands (old filament out, runout, or the new one loaded):
  # HOME / AWAY can only change the swaps after it.
  {% set hands = cs.state|int > 0 and (cs.unloaded|int == 1 or cs.runout|int == 1 or cs.state|int == 2) %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if g >= 0 and g < groups|length and groups[g][1] != "hide" %}
  # ---- one group: its settings, the ones that do not apply to this printer left out ----
  {% set kind = groups[g][1] %}
  {% set items = [] %}
  # it[7]: when the line is shown. "delta" / "notdelta", "has_beeper" (the buzzer pin
  # exists), "has_sensor" (a filament sensor was found), a setting name (shown while that
  # setting is not 0) or "!name" (shown while it is 0); several are space-separated.
  {% for it in groups[g][2] %}
    {% set sh = namespace(ok=true) %}
    {% for c in it[7].split() %}
      {% if (c == "delta" and not delta) or (c == "notdelta" and delta) %}
        {% set sh.ok = false %}
      {% elif c == "has_beeper" and not (cfg.beeper_pin and ("output_pin " ~ cfg.beeper_pin) in printer) %}
        {% set sh.ok = false %}
      {% elif c == "has_sensor" and not cs.sensor_obj %}
        {% set sh.ok = false %}
      {% elif c[:1] == "!" and c[1:] in cfg and cfg[c[1:]]|float != 0 %}
        {% set sh.ok = false %}
      {% elif c in cfg and cfg[c]|float == 0 %}
        {% set sh.ok = false %}
      {% endif %}
    {% endfor %}
    {% if sh.ok %}
      {% set _ = items.append(it) %}
    {% endif %}
  {% endfor %}
  {% set pages = [((items|length + per - 1) // per), 1]|max %}
  {% set page = [[params.P|default(0)|int, 0]|max, pages - 1]|min %}
  RESPOND TYPE=command MSG="action:prompt_begin {groups[g][0]}{(' - page ' ~ (page + 1) ~ ' of ' ~ pages) if pages > 1 else ''}"
  RESPOND TYPE=command MSG="action:prompt_text Tap a line to change it. ON and OFF switch at once. A star marks what you changed."
  {% for it in items[page * per:(page + 1) * per] %}
  {% set v = cfg[it[0]]|float %}
  {% set star = "* " if v != sec["variable_" ~ it[0]]|default(v)|float else "" %}
  {% if it[2] == 0 %}
  RESPOND TYPE=command MSG="action:prompt_button {star}{it[1]}: {'ON' if v else 'OFF'}|_CS_SET_ADJ K={it[0]} T=1 G={g} P={page}|{'primary' if v else 'secondary'}"
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_button {star}{it[1]}: {v|int if v == v|int else v|round(3)}{it[5]}|_CS_SET_EDIT K={it[0]} G={g} P={page}|secondary"
  {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|COLOR_SWAP_SETTINGS V={kind}"
  {% if pages > 1 %}
  RESPOND TYPE=command MSG="action:prompt_footer_button {'Next page' if page + 1 < pages else 'First page'}|COLOR_SWAP_SETTINGS G={g} P={(page + 1) if page + 1 < pages else 0}"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_SET_CLOSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% elif view in ["adv", "setup"] %}
  # ---- the list of Advanced or Printer setup groups, with how many values were changed ----
  RESPOND TYPE=command MSG="action:prompt_begin {'Advanced' if view == 'adv' else 'Printer setup'}"
  {% if view == "adv" %}
  RESPOND TYPE=command MSG="action:prompt_text Fine tuning. The printer works well without touching any of this."
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text Set once when the macro is installed. Check install shows what was found on this printer."
  {% endif %}
  {% for gr in groups %}
  {% if gr[1] == view %}
  {% set ns = namespace(n=0) %}
  {% for it in gr[2] %}
    {% if cfg[it[0]]|float != sec["variable_" ~ it[0]]|default(cfg[it[0]])|float %}
      {% set ns.n = ns.n + 1 %}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button {gr[0]}{(' (' ~ ns.n ~ ' changed)') if ns.n > 0 else ''}|COLOR_SWAP_SETTINGS G={loop.index0}|secondary"
  {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|COLOR_SWAP_SETTINGS"
  {% if view == "setup" %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Check install|COLOR_SWAP_CHECK"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_SET_CLOSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  # ---- first window: the everyday choices ----
  {% set ns = namespace(mat=0, alert=0) %}
  {% for gr in groups %}
    {% if gr[0] == "Material temperatures" %}
      {% set ns.mat = loop.index0 %}
    {% elif gr[0] == "Alerts" %}
      {% set ns.alert = loop.index0 %}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_begin Color swap settings"
  {% if hands %}
  RESPOND TYPE=command MSG="action:prompt_text This swap needs somebody at the printer: the old filament is already out. HOME / AWAY only changes the NEXT swaps - set it before a swap starts. Now: {'AWAY' if away else 'HOME'}."
  {% elif away %}
  RESPOND TYPE=command MSG="action:prompt_text AWAY: a swap waits {cfg.auto_continue_min|int} min, then the print goes on with the color it has (a change of material always waits for you). Changes apply at once and are kept."
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_text HOME: every swap waits for you and the old filament is pulled out at once. Leaving? Tap AWAY before the swap starts. Changes apply at once and are kept."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button {'Next swaps: ' if hands else ''}{'I am AWAY - tap when you are home' if away else 'I am HOME - tap when you leave'}|_CS_SET_MODE|{'warning' if away else 'primary'}"
  RESPOND TYPE=command MSG="action:prompt_button Away: continue by itself after {cfg.away_min|int} min|_CS_SET_EDIT K=away_min G=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Purge amount: {cs.purge_level|upper}|_CS_PURGE_LEVEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Material temperatures|COLOR_SWAP_SETTINGS G={ns.mat}|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Alerts|COLOR_SWAP_SETTINGS G={ns.alert}|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Advanced...|COLOR_SWAP_SETTINGS V=adv|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Printer setup...|COLOR_SWAP_SETTINGS V=setup|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Factory reset...|_CS_SET_RESET|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CS_SET_CLOSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_SET_MODE]
description: Settings button - switch between HOME (every swap waits) and AWAY (the print continues by itself)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% if cfg.auto_continue_min|float > 0 %}
  _CS_SET_ADJ K=auto_continue_min V=0 Q=1
  {% else %}
  _CS_SET_ADJ K=auto_continue_min V={[cfg.away_min|float, 1]|max} Q=1
  {% endif %}
  COLOR_SWAP_SETTINGS


[gcode_macro _CS_PURGE_LEVEL]
description: Settings button - purge amount LOW, NORMAL or HIGH: sets the default purge, both extras and the three purge buttons together
gcode:
  {% set sec = printer.configfile.settings["gcode_macro _color_swap_cfg"]|default({}) %}
  {% set cur = printer["gcode_macro COLOR_SWAP"].purge_level %}
  {% set nxt = params.L|default({"low": "normal", "normal": "high", "high": "low"}[cur]|default("normal"))|lower %}
  {% set fac = {"low": 0.6, "normal": 1.0, "high": 1.8}[nxt]|default(1.0) %}
  {% for k in ["purge_default", "purge_to_main_extra", "purge_material_change", "purge_btn1", "purge_btn2", "purge_btn3"] %}
  {% if ("variable_" ~ k) in sec %}
  {% set d = sec["variable_" ~ k]|float %}
  _CS_SET_ADJ K={k} V={d if fac == 1.0 else [((d * fac / 5)|round(0) * 5), 5]|max} Q=1
  {% endif %}
  {% endfor %}
  COLOR_SWAP_SETTINGS


[gcode_macro _CS_SET_EDIT]
description: Settings button - show one number with what it does and minus / plus buttons
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set groups = printer["gcode_macro _CS_SCHEMA"].groups %}
  {% set k = params.K|default("")|lower %}
  {% set g = params.G|default(-1)|int %}
  {% set p = params.P|default(0)|int %}
  {% set sec = printer.configfile.settings["gcode_macro _color_swap_cfg"]|default({}) %}
  {% set ns = namespace(it=none) %}
  {% for gr in groups %}
    {% for it in gr[2] %}
      {% if it[0] == k %}
        {% set ns.it = it %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% if ns.it and k in cfg %}
  {% set it = ns.it %}
  {% set v = cfg[k]|float %}
  {% set d = sec["variable_" ~ k]|default(v)|float %}
  {% set s = it[2]|float %}
  {% set dtxt = d|int if d == d|int else d|round(3) %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {it[1]}: {v|int if v == v|int else v|round(3)}{it[5]}"
  RESPOND TYPE=command MSG="action:prompt_text {it[6]} {'Changed - the file default is ' ~ dtxt ~ '.' if v != d else 'This is the file default.'} Allowed: {it[3]} to {it[4]}."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button - {(s * 10)|int if (s * 10) == (s * 10)|int else (s * 10)|round(3)}|_CS_SET_ADJ K={k} D={0 - s * 10} G={g} P={p} E=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button - {s|int if s == s|int else s}|_CS_SET_ADJ K={k} D={0 - s} G={g} P={p} E=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button + {s|int if s == s|int else s}|_CS_SET_ADJ K={k} D={s} G={g} P={p} E=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button + {(s * 10)|int if (s * 10) == (s * 10)|int else (s * 10)|round(3)}|_CS_SET_ADJ K={k} D={s * 10} G={g} P={p} E=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% if v != d %}
  RESPOND TYPE=command MSG="action:prompt_button Back to the file default ({dtxt})|_CS_SET_ADJ K={k} V={d} G={g} P={p} E=1|info"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Done|COLOR_SWAP_SETTINGS G={g} P={p}|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _CS_SET_ADJ]
description: Settings button - change one setting (D= step, V= value, T=1 toggle), apply it and save it. Q=1 shows nothing
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set groups = printer["gcode_macro _CS_SCHEMA"].groups %}
  {% set k = params.K|default("")|lower %}
  {% set g = params.G|default(-1)|int %}
  {% set p = params.P|default(0)|int %}
  {% set ns = namespace(it=none) %}
  {% for gr in groups %}
    {% for it in gr[2] %}
      {% if it[0] == k %}
        {% set ns.it = it %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% if ns.it and k in cfg %}
  {% set it = ns.it %}
  {% set cur = cfg[k]|float %}
  {% if params.V is defined %}
    {% set nv = params.V|float %}
  {% elif params.T|default(0)|int == 1 or it[2] == 0 %}
    {% set nv = 0 if cur else 1 %}
  {% else %}
    {% set nv = cur + params.D|default(0)|float %}
  {% endif %}
  {% set nv = ([[nv, it[3]|float]|max, it[4]|float]|min)|round(4) %}
  # Values that only make sense together: the purge limits never cross, and a
  # material temperature is 0 (button hidden) or at least min_temp (a swap below
  # min_temp is refused, so such a button could never work).
  {% if k == "purge_min" %}
    {% set nv = [nv, cfg.purge_max|float]|min %}
  {% elif k == "purge_max" %}
    {% set nv = [nv, cfg.purge_min|float]|max %}
  {% elif k.startswith("temp_") and nv > 0 and nv < cfg.min_temp|float %}
    {% set nv = 0 if nv < cur else cfg.min_temp|float %}
  {% endif %}
  {% set nv = nv|int if nv == nv|int else nv %}
  # While AWAY, the waiting time in use follows the away time. (Done here and not by
  # calling this macro again: Klipper refuses a macro that calls itself.)
  {% set follow = k == "away_min" and cfg.auto_continue_min|float > 0 %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE={k} VALUE={nv}
  {% if follow %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE=auto_continue_min VALUE={nv}
  {% endif %}
  {% if "save_variables" in printer %}
  {% set old = printer.save_variables.variables.cs_set|default(0) %}
  {% set ov = {} %}
  {% if old is mapping %}
    {% for kk, vv in old.items() %}
      {% set _ = ov.update({kk: vv}) %}
    {% endfor %}
  {% endif %}
  {% set _ = ov.update({k: nv}) %}
  {% if follow %}
    {% set _ = ov.update({"auto_continue_min": nv}) %}
  {% endif %}
  SAVE_VARIABLE VARIABLE=cs_set VALUE="{ov}"
  {% elif params.Q|default(0)|int == 0 %}
  RESPOND TYPE=command MSG="Changed until the next restart only: add [save_variables] to printer.cfg to keep settings."
  {% endif %}
  _CS_DETECT
  {% if params.Q|default(0)|int == 1 %}
  {% elif params.E|default(0)|int == 1 %}
  _CS_SET_EDIT K={k} G={g} P={p}
  {% else %}
  COLOR_SWAP_SETTINGS G={g} P={p}
  {% endif %}
  {% endif %}


[gcode_macro _CS_SET_RESET]
description: Settings button - put every setting back to the value written in this file (GO=1 does it)
gcode:
  {% set groups = printer["gcode_macro _CS_SCHEMA"].groups %}
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set sec = printer.configfile.settings["gcode_macro _color_swap_cfg"]|default({}) %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if params.GO|default(0)|int != 1 %}
  RESPOND TYPE=command MSG="action:prompt_begin Factory reset?"
  RESPOND TYPE=command MSG="action:prompt_text Every color swap setting goes back to its factory value, the one written in color_swap.cfg. Your HOME / AWAY choice and a saved resume point are kept. This cannot be undone."
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, factory reset|_CS_SET_RESET GO=1|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|COLOR_SWAP_SETTINGS|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
  # HOME / AWAY is where you are, not a setting: it survives the reset (AWAY then
  # waits the factory away time).
  {% set away = cfg.auto_continue_min|float > 0 %}
  {% set away_v = [sec["variable_away_min"]|default(5)|float, 1]|max %}
  {% set away_v = away_v|int if away_v == away_v|int else away_v %}
  {% for gr in groups %}
  {% for it in gr[2] %}
  {% if it[0] in cfg and ("variable_" ~ it[0]) in sec and it[0] != "auto_continue_min" %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE={it[0]} VALUE={sec["variable_" ~ it[0]]|float}
  {% endif %}
  {% endfor %}
  {% endfor %}
  # The mode is written and saved explicitly, so HOME stays HOME even though the
  # factory mode is AWAY.
  {% set mode_v = away_v if away else 0 %}
  SET_GCODE_VARIABLE MACRO=_COLOR_SWAP_CFG VARIABLE=auto_continue_min VALUE={mode_v}
  {% if "save_variables" in printer %}
  SAVE_VARIABLE VARIABLE=cs_set VALUE="{ {'auto_continue_min': mode_v} }"
  {% endif %}
  _CS_DETECT
  RESPOND TYPE=command MSG="Factory reset done: every color swap setting is back to its factory value. Mode kept: {'AWAY' if away else 'HOME'}."
  COLOR_SWAP_SETTINGS
  {% endif %}


[gcode_macro COLOR_SWAP_SET]
description: Type one setting from the console: COLOR_SWAP_SET NAME=reprime_mm VALUE=2 - with no NAME it lists every setting and its value
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set groups = printer["gcode_macro _CS_SCHEMA"].groups %}
  {% set k = params.NAME|default("")|lower %}
  {% if k and k in cfg and params.VALUE is defined %}
  _CS_SET_ADJ K={k} V={params.VALUE|float} Q=1
  _CS_SET_SAY K={k}
  {% elif k %}
  RESPOND TYPE=error MSG="COLOR_SWAP_SET: use NAME=<setting> VALUE=<number>. Run COLOR_SWAP_SET alone for the list of names."
  {% else %}
  {% for gr in groups %}
  {% for it in gr[2] %}
  {action_respond_info("%s = %s   (%s - %s)" % (it[0], cfg[it[0]], gr[0], it[1]))}
  {% endfor %}
  {% endfor %}
  {% endif %}


[gcode_macro _CS_SET_SAY]
description: Helper - answer with the value a setting has now
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set k = params.K|default("")|lower %}
  {% if k in cfg %}
  RESPOND TYPE=command MSG="{k} is now {cfg[k]}"
  {% endif %}


[gcode_macro COLOR_SWAP_FACTORY_RESET]
description: Put every color swap setting back to its factory value (asks first)
gcode:
  _CS_SET_RESET


[gcode_macro _CS_SET_CLOSE]
description: Settings button - close the settings window (a waiting swap or resume window comes back)
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  _CS_SHOW_PROMPT
  {% elif printer["gcode_macro RESUME_SAVED_PRINT"].step|int == 1 %}
  _CS_RS_SHOW
  {% endif %}


[gcode_macro COLOR_SWAP_CHECK]
description: Check the installation on this printer: what COLOR_SWAP found and what is missing (nothing moves)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set settings = printer.configfile.settings %}
  {% set th = printer.toolhead %}
  {% set lo, hi = th.axis_minimum, th.axis_maximum %}
  {% set delta = settings.printer.kinematics == "delta" %}
  {% set resume = (settings["gcode_macro resume"]|default({})).gcode|default("") %}
  {% set cancel = (settings["gcode_macro cancel_print"]|default({})).gcode|default("") %}
  {% set ns = namespace(lock=[], sensor="", miss=[], hooks=[]) %}
  {% for sec in ["pause_resume", "respond", "save_variables", "virtual_sdcard"] %}
    {% if sec not in settings %}
      {% set _ = ns.miss.append("[" ~ sec ~ "]") %}
    {% endif %}
  {% endfor %}
  {% for key in settings %}
    {% if key.startswith("tmc") and " " in key and "hold_current" in settings[key] %}
      {% set st = key.split(" ", 1)[1] %}
      {% if ((st in cfg.hold_steppers) if cfg.hold_steppers|length > 0 else st.startswith("stepper_")) %}
        {% set _ = ns.lock.append(st) %}
      {% endif %}
    {% endif %}
    {% if not ns.sensor and (key.startswith("filament_switch_sensor ") or key.startswith("filament_motion_sensor ")) %}
      {% set ns.sensor = key %}
    {% endif %}
  {% endfor %}
  {% if "_COLOR_SWAP_ON_RESUME" not in resume %}
    {% set _ = ns.hooks.append("RESUME has no _COLOR_SWAP_ON_RESUME line (pressing RESUME with no filament loaded is then not refused)") %}
  {% endif %}
  {% if "_COLOR_SWAP_RESET" not in cancel %}
    {% set _ = ns.hooks.append("CANCEL_PRINT has no _COLOR_SWAP_RESET line (the swap is then cleared a few seconds later by the waiting clock)") %}
  {% endif %}
  {% if cfg.park_auto|int == 1 %}
    {% set px = 0.0 if delta else (lo.x|float + hi.x|float) / 2 %}
    {% set py = lo.y|float + cfg.park_edge|float %}
  {% else %}
    {% set px = cfg.park_x|float %}
    {% set py = cfg.park_y|float %}
  {% endif %}
  {action_respond_info("COLOR_SWAP version 6.2 - installation check")}
  {action_respond_info("Printer: %s, X %.0f..%.0f, Y %.0f..%.0f, Z max %.0f" % (settings.printer.kinematics, lo.x, hi.x, lo.y, hi.y, hi.z))}
  {action_respond_info("Park point: X %.1f Y %.1f (%s), at least Z %.0f" % (px, py, "automatic" if cfg.park_auto|int == 1 else "manual", cfg.park_min_z|float))}
  {action_respond_info("Missing sections: %s" % (ns.miss|join(", ") if ns.miss else "none - good"))}
  {action_respond_info("Layer-1 wipe line: %s" % ("ready" if ("exclude_object" in printer and (not delta or "gcode_arcs" in settings)) else "off - needs [exclude_object]" ~ (" and [gcode_arcs]" if delta else "")))}
  {action_respond_info("Filament sensor: %s" % (ns.sensor if ns.sensor else "none found (runout and the load check are skipped)"))}
  {action_respond_info("Head lock motors: %s" % (ns.lock|join(", ") if ns.lock else "none (no TMC hold_current found - nothing to do)"))}
  {action_respond_info("Longest single extruder move: %.0f mm (longer loads are split)" % ((settings.extruder|default({})).max_extrude_only_distance|default(50)|float))}
  {action_respond_info("Resume after power loss: %s" % ("delta - homing goes up, always possible" if delta else ("X/Y homing with trusted Z is ON" if cfg.resume_trust_z|int == 1 and (settings.force_move|default({})).enable_force_move|default(false) else "only while the motors are still on (see resume_trust_z)")))}
  {action_respond_info("Phone messages: %s. Telegram bot buttons: %s. Buzzer pin: %s" % (("notifier " ~ cfg.notify_name) if cfg.notify|int == 1 and cfg.notify_name else "off", "on" if cfg.tg_bot|int == 1 else "off", "found" if ("output_pin " ~ cfg.beeper_pin) in printer else "not fitted"))}
  {% for h in ns.hooks %}
  {action_respond_info("Hint: " ~ h)}
  {% endfor %}
  {% if not ns.hooks %}
  {action_respond_info("Hook lines in RESUME and CANCEL_PRINT: found - good")}
  {% endif %}


# ---------------------------------------------------------------------------
# Alerts (phone message + buzzer beep) and remote control
# ---------------------------------------------------------------------------

[gcode_macro _CS_ALERT]
description: Helper - phone message and beep for a stage. Never stops the print (sent from timers). BEEP=0 = silent
variable_msg: ""
variable_kind: "info"
variable_do_beep: 1
gcode:
  # KIND (swap, runout, purge, auto, off, remind, saved, resume, test, status, wait,
  # keep, go, cancel) reaches the phone as "KIND|text": the [notifier] body in
  # moonraker.conf turns it into a heading with a colored mark and an emoji (v6.4).
  # Store the text, then send it from timers: a failed send (Moonraker restarting,
  # no notifier) is only logged by the timer and can never break a print or a swap.
  {% set text = params.MSG|default("The printer needs you")|replace('"', '')|replace("'", '') %}
  SET_GCODE_VARIABLE MACRO=_CS_ALERT VARIABLE=msg VALUE='"{text}"'
  SET_GCODE_VARIABLE MACRO=_CS_ALERT VARIABLE=kind VALUE='"{params.KIND|default("info")|lower}"'
  SET_GCODE_VARIABLE MACRO=_CS_ALERT VARIABLE=do_beep VALUE={params.BEEP|default(1)|int}
  # Console line (no screen popup) that the Telegram panel turns into a message.
  RESPOND TYPE=command MSG="cs_alert {params.KIND|default('info')|lower}|{text}"
  UPDATE_DELAYED_GCODE ID=_CS_ALERT_SEND DURATION=0.2
  UPDATE_DELAYED_GCODE ID=_CS_TG_SEND DURATION=0.3
  UPDATE_DELAYED_GCODE ID=_CS_BEEP_RUN DURATION=0.4


[delayed_gcode _CS_ALERT_SEND]
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% if cfg.notify|int == 1 and cfg.notify_name and cfg.tg_panel|int == 0 %}
  {% set a = printer["gcode_macro _CS_ALERT"] %}
  {action_call_remote_method("notify", name=cfg.notify_name, message=a.kind ~ "|" ~ a.msg)}
  {% endif %}


[delayed_gcode _CS_TG_SEND]
# moonraker-telegram-bot: the same message, with buttons that run the CS_ commands.
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set msg = printer["gcode_macro _CS_ALERT"].msg %}
  {% if cfg.tg_bot|int == 1 %}
  {% if cs.state|int == 1 and cs.unloaded|int == 0 and cs.runout|int == 0 %}
  {% set kb = "message='" ~ msg ~ "', buttons=[{name='Keep color', command='CS_KEEP'}, {name='Wait for me', command='CS_WAIT'}, {name='Status', command='CS_STATUS'}, {name='Cancel print', command='CS_CANCEL'}]" %}
  {% elif cs.state|int == 1 %}
  {% set kb = "message='" ~ msg ~ "', buttons=[{name='Load + purge', command='CS_LOAD'}, {name='Status', command='CS_STATUS'}, {name='Cancel print', command='CS_CANCEL'}]" %}
  {% elif cs.state|int == 2 %}
  {% set kb = "message='" ~ msg ~ "', buttons=[{name='Continue print', command='CS_CONTINUE'}, {name='Purge more', command='CS_PURGE'}, {name='Status', command='CS_STATUS'}, {name='Cancel print', command='CS_CANCEL'}]" %}
  {% else %}
  {% set kb = "" %}
  {% endif %}
  {% if kb %}
  RESPOND PREFIX=tgcustom_keyboard MSG="{kb}"
  {% else %}
  RESPOND PREFIX=tgalarm MSG="{msg}"
  {% endif %}
  {% endif %}


[delayed_gcode _CS_BEEP_RUN]
gcode:
  {% if printer["gcode_macro _CS_ALERT"].do_beep|int == 1 %}
  _CS_BEEP
  {% endif %}


[gcode_macro _CS_BEEP]
description: Beep the buzzer (only if the output pin exists, and never while the nozzle is printing)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set pin = cfg.beeper_pin %}
  {% set ms = cfg.beep_ms|int %}
  # A dwell between print moves would leave a blob, so no beep while a print runs
  # (swaps, resume and runout are all paused or idle when they alert).
  {% set running = printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
  {% if cfg.beep|int == 1 and pin and ("output_pin " ~ pin) in printer and not running %}
  {% for i in range(cfg.beep_count|int) %}
  SET_PIN PIN={pin} VALUE=1
  G4 P{ms}
  SET_PIN PIN={pin} VALUE=0
  G4 P{ms}
  {% endfor %}
  {% endif %}


[gcode_macro TEST_ALERT]
description: Send a test phone message and beep (no movement)
gcode:
  _CS_ALERT KIND=test MSG="Test alert from the printer (COLOR_SWAP)"
  RESPOND MSG="Test alert sent: check your phone (and listen for the buzzer, if one is fitted)."


# Remote commands: plain names, no prompt needed. Use them from anything that can
# send a command to the printer from outside: moonraker-telegram-bot (/cs_status,
# /cs_keep ... or the buttons under each message), Mainsail or Fluidd over a VPN,
# Mobileraker, OctoApp. Each one answers on the phone.

[gcode_macro CS_STATUS]
description: Remote - where the color swap stands (answers on the phone too)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% set ps = printer.print_stats %}
  {% set t = printer.extruder.temperature|float|round(0)|int %}
  {% set mins = (cs.waited|float / 60)|int %}
  {% set ac = cfg.auto_continue_min|float * 60 %}
  {% if cs.state|int == 0 %}
  {% set text = "No color swap is waiting. Print state: " ~ ps.state ~ ". Swaps done in this print: " ~ cs.swaps|int ~ ". Nozzle " ~ t ~ "C" %}
  {% elif cs.state|int == 1 and cs.unloaded|int == 0 %}
  {% set mat_hold = cs.runout|int == 0 and cs.material and cs.old_material and cs.material != cs.old_material %}
  {% set auto = (", auto continue in " ~ ([((ac - cs.idle_s|float) / 60)|round(0, 'ceil')|int, 0]|max) ~ " min") if (ac > 0 and cs.touched|int == 0 and cs.runout|int == 0 and not mat_hold) else (", material changes (" ~ cs.old_material ~ " to " ~ cs.material ~ "), waiting for you" if mat_hold else ", waiting for you") %}
  {% set text = "Swap to filament " ~ cs.slot ~ " " ~ cs.material ~ " waiting " ~ mins ~ " min. Old filament still loaded" ~ auto ~ ". Nozzle " ~ t ~ "C. Commands: CS_KEEP, CS_WAIT, CS_UNLOAD, CS_CANCEL" %}
  {% elif cs.state|int == 1 %}
  {% set text = "Swap waiting " ~ mins ~ " min: old filament is out, insert filament " ~ cs.slot ~ " " ~ cs.material ~ ". Nozzle " ~ t ~ "C. Commands: CS_LOAD, CS_CANCEL" %}
  {% else %}
  {% set text = "Swap waiting " ~ mins ~ " min: filament " ~ cs.slot ~ " " ~ cs.material ~ " loaded and purged. Nozzle " ~ t ~ "C. Commands: CS_CONTINUE, CS_PURGE, CS_CANCEL" %}
  {% endif %}
  RESPOND TYPE=command MSG="{text}"
  _CS_ALERT KIND=status MSG="{text}" BEEP=0


[gcode_macro CS_WAIT]
description: Remote - I am coming: switch auto continue off for this swap and keep waiting
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  _CS_TOUCH
  _CS_SHOW_PROMPT
  _CS_ALERT KIND=wait MSG="Holding: this swap now waits for you, auto continue is off" BEEP=0
  {% else %}
  CS_STATUS
  {% endif %}


[gcode_macro CS_KEEP]
description: Remote - no swap: continue the print now with the color that is in the nozzle
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 1 and cs.unloaded|int == 0 and cs.runout|int == 0 %}
  _CS_ALERT KIND=keep MSG="Keeping the current color: the print continues" BEEP=0
  _CS_KEEP_GO
  {% else %}
  CS_STATUS
  {% endif %}


[gcode_macro CS_UNLOAD]
description: Remote - pull the old filament out
gcode:
  _CS_UNLOAD
  CS_STATUS


[gcode_macro CS_LOAD]
description: Remote - load the inserted filament and purge it (FORCE=1 skips the sensor check)
gcode:
  _CS_LOAD FORCE={params.FORCE|default(0)|int}
  CS_STATUS


[gcode_macro CS_PURGE]
description: Remote - purge MM more mm (default: the middle purge button)
gcode:
  {% set cfg = printer["gcode_macro _COLOR_SWAP_CFG"] %}
  _CS_PURGE_MORE MM={params.MM|default(cfg.purge_btn2)|float}
  CS_STATUS


[gcode_macro CS_CONTINUE]
description: Remote - the swap is done: continue the print (nobody cuts the strand - look at the camera first)
gcode:
  {% set cs = printer["gcode_macro COLOR_SWAP"] %}
  {% if cs.state|int == 2 %}
  _CS_ALERT KIND=go MSG="Continuing the print with filament {cs.slot} {cs.material}" BEEP=0
  _CS_CONTINUE
  {% else %}
  CS_STATUS
  {% endif %}


[gcode_macro CS_CANCEL]
description: Remote - cancel the print from a waiting swap (the filament stays where it is)
gcode:
  {% if printer["gcode_macro COLOR_SWAP"].state|int > 0 %}
  _CS_ALERT KIND=cancel MSG="Print cancelled from the color swap" BEEP=0
  _CS_CANCEL_PRINT UNLOAD=0
  {% else %}
  CS_STATUS
  {% endif %}
