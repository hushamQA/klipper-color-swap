#   ___      _              ___
#  / __|___ | |___ _ _     / __|_ __ ____ _ _ __
# | (__/ _ \| / _ \ '_|    \__ \ V  V / _` | '_ \
#  \___\___/|_\___/_|      |___/\_/\_/\__,_| .__/
#                                          |_|
# Manual multi-color on a single nozzle - any Klipper printer - version 6.6 (2026-11-22)
# Written on a Flsun V400 (delta). Cartesian, CoreXY and bed-slinger printers work
# with the same file: the park point, the wipe line and the homing are worked out
# from the printer's own limits and kinematics.
#
# One G-code file from OrcaSlicer; every filament change calls COLOR_SWAP.
# The print pauses in place: nozzle and bed stay hot, no re-homing, no re-mesh,
# so every color lands exactly where the slicer put it.
#
#   OrcaSlicer > Printer > Multimaterial > Manual filament change: ON
#   Change filament G-code (one line):
#     {if layer_num >= 0}COLOR_SWAP SLOT={next_extruder + 1} MATERIAL={filament_type[next_extruder]} OLD_MATERIAL={filament_type[previous_extruder]} TEMP={new_filament_temp} OLD_TEMP={old_filament_temp} RETRACT={new_retract_length_toolchange} PURGE={flush_length}{endif}
#
# SAFETY RULE: the nozzle never goes lower than where the slicer paused it.
#   The head lifts straight up, then moves to the park point. Load and purge are
#   extruder-only moves at that height. RESUME returns in one straight line to the
#   paused point (layer height plus the slicer's Z-hop), so every point of that
#   line is above the printed model. The only exception is the layer-1 wipe line,
#   drawn on the bed edge away from every model outline.
#
# Filament accounting (no gap and no blob when the print continues):
#   swap start   slicer retracted RETRACT, PAUSE retracts pause_retract_mm
#   load+purge   ends retracted by `hold` = max(RETRACT, 1)
#   Continue...  pushes hold + refill_mm, pulls hold back; you cut that strand (v6.6)
#   continue     pushes hold + reprime_mm, retracts RETRACT + pause_retract_mm,
#                then RESUME pushes pause_retract_mm and the slicer pushes RETRACT
#
# Needed in printer.cfg:  [pause_resume] [respond] [save_variables] [virtual_sdcard]
#   (and [exclude_object] plus [gcode_arcs] for the layer-1 wipe line).
#   Run COLOR_SWAP_CHECK after installing: it lists what is missing.
#
# Recommended one-line hooks (the macro also works without them, less strictly):
#   RESUME        first line:  _COLOR_SWAP_ON_RESUME     (refuses to resume with no filament)
#   CANCEL_PRINT  first line:  _CS_STOP_POINT   (v6.4: "continue from where it stopped")
#   CANCEL_PRINT  before CANCEL_PRINT_BASE:  _COLOR_SWAP_RESET
#   START_PRINT   first line:  _CS_CLEAR_CHECKPOINT
#   END_PRINT     last line:   _CS_CLEAR_CHECKPOINT DONE=1
#
# SETTINGS: every number below can be changed on the screen, with no file editing:
#   KlipperScreen > Color swap settings   (or the COLOR_SWAP_SETTINGS macro in Mainsail)
#   Four names stay in this file: notify_name, beeper_pin, sensor, hold_steppers.
#   Changes apply at once and are kept in variables.cfg (cs_set). The values in this
#   file are the factory values that "File default" and "Factory reset" go back to.
#
# Version 6.6 (2026-11-22): no empty stretch after a swap
#   - after the purge the nozzle keeps oozing while you look at the color and cut the
#     strand, so it came back to the part half empty: the head drew a stretch of the
#     layer with nothing coming out. Continue... now pushes refill_mm (5) of fresh
#     plastic first, and the next window asks you to cut THAT strand, a few seconds
#     before the print goes on. The plastic left in the nozzle is the plastic the print
#     needs. No prime tower and no slicer change. 0 = the old behaviour.
#     Measured: the layer-1 wipe arc came out only from its middle = about 5 mm of
#     filament missing at the start (half the arc x wipe_e_per_mm 0.1).
#   - unloading stopped for 3 s halfway (unload_dwell_ms 3000): the filament cooled
#     and came out hard. It is one pull again, with no stop (unload_dwell_ms 0).
#   - purge back to the main filament: purge_to_main_extra 60 -> 20 (the PETG purge
#     was about 1/3 too long).
#
# Version 6.5 (2026-11-21): AWAY never goes on with the wrong material
#   - AWAY continued after 5 min with the old filament even when the slicer asked for
#     another MATERIAL (PLA -> PETG support interface, TPU part...): a part that looks
#     right but is wrong. A swap that changes the material type now waits for you like
#     HOME (the old filament still stays in, so Keep / CS_KEEP can still go on with it
#     on purpose). The nozzle cools to standby while it waits. Same material = as before.
#   - the reminder said "insert the filament" while the old filament was still in: it
#     now says "press Unload" (and names the material change)
#
# Version 6.4 (2026-11-20): the frozen screen, and no more waiting for a cool-down
#   - KlipperScreen froze during a swap: a message popup ("Resume point saved...")
#     opened on top of the swap window, hid it behind the normal screen and held every
#     touch until the window closed (5 min later, by auto continue). Messages sent while
#     a window is open now go to the console only ("// ..."); an error closes the window,
#     shows, then the window comes back on top.
#   - never wait for the nozzle to cool down: a hotter nozzle unloads, loads, purges and
#     continues at once (it reaches the lower temperature by itself). Only heating up
#     is waited for. This removes 30-40 s from every swap to a cooler filament.
#   - AWAY: the nozzle stays at the old filament's temperature until Unload, so a swap
#     that ends with the old color does not print it too hot
#   - cancel + unload heats for the filament that is in the nozzle, not the next one
#   - CANCEL_PRINT keeps where the print really stopped (_CS_STOP_POINT hook, first line):
#     Resume saved offers "From where it stopped" next to the last save point, so the
#     lines printed after the save point are not printed twice
#   - phone messages carry their kind (KIND|text): the [notifier] body in moonraker.conf
#     turns it into a colored heading with an emoji (moonraker_notifier.txt)
#
# Version 6.3 (2026-11-15): settings reviewed on the printer
#   - the factory mode is AWAY, 5 min: a print started by anyone finishes by itself
#     (a swap keeps the old color after 5 min). HOME is one tap for full control.
#   - the minus buttons raised the value ("{-x}" is Jinja whitespace control, not a
#     minus sign): every - button now lowers it
#   - Factory reset keeps HOME / AWAY (where you are is not a setting)
#   - AWAY: no cool-down / heater off while the print is about to go on by itself
#   - values that never cross: purge min <= purge max; a material temperature is 0 or
#     at least min_temp; the away time is at most 60 min
#   - lines that do nothing are hidden: buzzer without a buzzer pin, sensor options
#     without a sensor, beep / reminder / standby / pulse / start line / park X-Y
#     details while what they belong to is off
#   - during a swap whose filament is already out, HOME / AWAY says it is for the
#     NEXT swaps
#
# Version 6.2 (2026-11-12): first version installed on the printer
#   - "Factory reset..." on the first settings window (COLOR_SWAP_FACTORY_RESET)
#   - COLOR_SWAP_SET NAME=<setting> VALUE=<number> types a value from the console
#   - fixes found on the real printer: a settings macro called itself (Klipper
#     refuses that), and two lines of COLOR_SWAP_CHECK read the wrong object
#
# Version 6.1 (2026-11-11): simpler settings window
#   - first window: HOME / AWAY button, the away time, purge amount LOW / NORMAL /
#     HIGH, material temperatures, alerts. Everything else is under Advanced, and
#     what is set once at install time is under Printer setup.
#   - every number explains itself, a star marks what you changed, and settings
#     that do not apply to this printer are not shown
#
# Version 6 (2026-11-11):
#   - settings window on the screen (COLOR_SWAP_SETTINGS), saved across restarts
#   - any printer: automatic park point, wipe line and sensor / motor detection
#   - auto_unload option, and auto_continue_min: no swap after N minutes = the print
#     goes on with the current color
#   - a waiting swap can no longer lose the print after one hour: the nozzle cools to
#     standby, then switches off, while the bed and the motors stay on
#   - reminders, remote commands (CS_STATUS, CS_KEEP, CS_WAIT, CS_CONTINUE...) and
#     Telegram buttons through moonraker-telegram-bot
#   - runout / M600 opens the same window, the sensor is checked before loading,
#     five material presets, slower loading for flexible filament, long (bowden)
#     load and unload moves are split, swap statistics
#   - fix: the main filament is saved in the resume point (a power cut used to lose
#     it, so the extra purge back to the main filament went to the wrong swap)


[gcode_macro _COLOR_SWAP_CFG]
description: Settings for COLOR_SWAP - change them on the screen (COLOR_SWAP_SETTINGS) or here
# ---- Park point (where the filament is changed and purged, in the air) ----
# park_auto 1: X = bed centre (delta: 0), Y = front limit + park_edge. 0: park_x / park_y.
variable_park_auto: 1
variable_park_x: 0
variable_park_y: -140
variable_park_edge: 12
# Never lower than the model + park_lift, and at least park_min_z.
variable_park_lift: 10
variable_park_min_z: 60
# ---- Swap behaviour ----
# auto_unload 1: the old filament is pulled out as soon as the head is parked.
#             0: the window opens with the filament still in and an Unload button.
variable_auto_unload: 1
# auto_continue_min > 0 (AWAY, the factory mode): nobody touches the window for this
# many minutes = the print continues with the CURRENT color. The old filament stays in
# for that, so the unload is the Unload button (by hand). 0 = HOME: every swap waits,
# and auto_unload pulls the old filament out at once. AWAY is the factory mode so that
# a print started by somebody who knows nothing about swaps still finishes by itself.
# A swap that changes the MATERIAL type (PLA -> PETG) never continues by itself (v6.5).
variable_auto_continue_min: 5
# The HOME / AWAY button in the settings window: AWAY copies away_min into
# auto_continue_min, HOME sets auto_continue_min back to 0.
variable_away_min: 5
# Refuse Load + purge when the filament switch sensor sees no filament.
variable_load_check_sensor: 1
# Runout sensor / M600 open this same window (needs the M600 line in macros.cfg).
variable_runout_swap: 1
# mm that YOUR printer's own PAUSE retracts and its RESUME pushes back (Mainsail,
# Fluidd and the V400 macros: 1). 0 if your RESUME pushes nothing.
variable_pause_retract_mm: 1.0
# Speed of the return travel to the model in mm/s. Fast = less ooze on the way.
variable_resume_speed: 250
# Heating waits end as soon as the nozzle is within this many degrees below the target.
# A nozzle that is already hotter never waits to cool down (v6.4).
variable_heat_band: 3
# Below this nozzle temperature nothing is loaded, unloaded or swapped.
variable_min_temp: 170
# ---- Waiting (nothing here can lose the print) ----
# After standby_min minutes with no button pressed the nozzle cools to standby_temp
# (filament left hot for long oozes and burns). The next button reheats; Continue
# then purges standby_purge_mm first and asks again. 0 = stay hot.
variable_standby_min: 5
variable_standby_temp: 170
variable_standby_purge_mm: 10
# After nozzle_off_min minutes the nozzle heater is switched off. The bed and the
# motors STAY ON, so the print can still continue. 0 = never off.
variable_nozzle_off_min: 60
# Only after wait_max_min minutes does Klipper switch everything off (the print can
# then only go on with RESUME_SAVED_PRINT).
variable_wait_max_min: 480
# A phone message every remind_min minutes while a swap waits. 0 = one message only.
variable_remind_min: 10
# Head lock: 1 = while a swap or a resume waits, the motors hold at run_current
# instead of hold_current, so pushing filament in does not move the head.
variable_hold_boost: 1
# ---- Unload (Marlin-style tip forming): push unload_purge_mm, snap back
# unload_snap_mm fast, then the rest in the same pull (unload_dwell_ms > 0 stops in
# between to let the tip set - v6.6 default 0, the filament cooled and stuck). Always hot.
# Bowden: set unload_mm and load_mm to the tube length; long moves are split.
variable_unload_mm: 40
variable_unload_purge_mm: 3
variable_unload_snap_mm: 13
variable_unload_dwell_ms: 0
# ---- Load: the first part at load_speed (mm/min), the last load_slow_mm slowly.
variable_load_mm: 40
variable_load_slow_mm: 15
variable_load_speed: 600
# TPU / TPE / FLEX are loaded and purged at this percent of the speeds.
variable_flex_speed_pct: 50
# ---- Purge, in mm of filament (1 mm = 2.4 mm3). OrcaSlicer sends PURGE from its
# flushing-volume matrix; purge_min / purge_max clamp it; purge_default when none.
variable_purge_min: 25
variable_purge_max: 250
variable_purge_default: 50
# Added when the material type changes (PLA <-> PETG).
variable_purge_material_change: 15
# Added when going BACK to the print's main filament after another material
# (PLA support -> PETG body): a trace of PLA makes that PETG layer brittle.
# v6.6: 60 -> 20. On the V400 the PETG came out clean with 2/3 of the old total
# (slicer 46 + 15 + 60 = 121 mm was too much; 46 + 15 + 20 = 81 mm).
variable_purge_to_main_extra: 20
# mm/min. 180 = 3 mm/s = Marlin ADVANCED_PAUSE_PURGE_FEEDRATE.
variable_purge_speed: 180
# Pulsed purge: chunks of purge_pulse_mm with a quick pull-back and push of
# purge_pulse_retract between them. purge_pulse_mm 0 = one steady purge.
variable_purge_pulse_mm: 20
variable_purge_pulse_retract: 2
# The three "Purge +N mm" buttons.
variable_purge_btn1: 15
variable_purge_btn2: 30
variable_purge_btn3: 60
# After purging hotter than the new filament prints: push this right away (the nozzle
# is not waited for; it cools to the new temperature while you check the purge).
variable_settle_mm: 8
# Continue... (v6.6): push this much fresh plastic, then you cut that strand. The
# nozzle oozes while you check the purge; this fills it again a few seconds before
# the print goes on. 0 = off (cut right after the purge, as before 6.6).
variable_refill_mm: 5
# On Continue: refill what ooze and the tweezers took out of the nozzle.
variable_reprime_mm: 1.5
# ---- Material presets: buttons in the swap window, and the temperature used when
# the slicer sends none. 0 hides the button.
variable_temp_pla: 215
variable_temp_petg: 240
variable_temp_abs: 250
variable_temp_asa: 255
variable_temp_tpu: 225
# ---- Layer-1 wipe line: when a swap happens in layer 1, a short line is drawn on
# the bed edge after the purge so the new color starts full. Delta: an arc wipe_edge
# mm inside the front-right limit. Others: a straight line wipe_len long, wipe_edge
# mm from the front limit. Each layer-1 swap moves the next line wipe_step inward.
# Skipped, with the reason on screen, when a model outline is within wipe_margin mm.
variable_first_layer_wipe: 1
variable_first_layer_max_z: 0.75
variable_wipe_edge: 7
variable_wipe_len: 80
variable_wipe_step: 1.2
variable_wipe_z: 0.3
variable_wipe_e_per_mm: 0.1
variable_wipe_speed: 1200
variable_wipe_margin: 10
# Flick after the reprime: part fan on, then short fast side moves snap the strand.
variable_flick: 0
variable_flick_mm: 8
variable_flick_cool_ms: 1500
# ---- Power-loss resume ----
# Every autosave_s seconds while printing the file position is saved. 0 = off.
variable_autosave_s: 60
# After the printer starts with an unfinished print saved, open the resume window.
variable_boot_prompt: 1
# Resume from a layer start: stop this far above the saved layer.
variable_resume_lift: 0.5
# NOT a delta, and the motors were switched off: 1 = trust that Z did not move,
# home only X and Y and continue (needs [force_move] enable_force_move: True).
# Only if your bed or gantry really stays in place without power. Untested.
variable_resume_trust_z: 0
# ---- Alerts and remote control ----
# notify 1: phone message through the Moonraker [notifier ...] named notify_name.
variable_notify: 1
# tg_bot 1: also talk to moonraker-telegram-bot (message with buttons that run the
# CS_... commands). Needs that bot installed. See README, part 5.
variable_tg_bot: 0
# tg_panel 1: the COLOR_SWAP Telegram panel (telegram_panel/) is installed and sends
# the swap messages itself (one updating card per swap). The [notifier] then stays quiet
# for them, so the phone does not get every message twice. The panel sets this itself.
variable_tg_panel: 0
# beep 1: buzzer on [output_pin <beeper_pin>]; skipped when the pin does not exist.
variable_beep: 1
variable_beep_count: 3
variable_beep_ms: 150
# ---- Names (edit here; not in the settings window) ----
variable_notify_name: "phone"
variable_beeper_pin: "beeper"
# Runout sensor switched off during a swap. "auto" = the first filament sensor found.
variable_sensor: "auto"
# Motors locked by hold_boost. [] = every stepper_* that has a TMC hold_current.
variable_hold_steppers: []
gcode:
  RESPOND MSG="_COLOR_SWAP_CFG holds settings only. Change them with COLOR_SWAP_SETTINGS."


