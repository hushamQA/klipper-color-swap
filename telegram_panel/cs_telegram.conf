# COLOR_SWAP Telegram control panel - settings.
# Leave token and chat_id as they are to use the bot of the Moonraker notifier
# (the tgram://TOKEN/CHAT_ID line in moonraker.conf) - then there is nothing to fill in.
# Only chat_id can use the panel. Everybody else is ignored.
[bot]
token: BOT_TOKEN
chat_id: CHAT_ID
# Name shown at the top of the panel.
title: FLSUN V400
# A message this many minutes before each color swap (from the slicer's time marks, M73). 0 = off.
warn_min: 10
# Camera for the Photo key and the pictures at a swap / purge / runout / print end.
# auto = the first webcam Moonraker knows; or a snapshot URL; off = no pictures, no Photo key.
camera: auto
# Timelapse (moonraker-timelapse): send the video of a complete print here. on / off.
timelapse_video: on
